.guess-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.guess-chip { padding: 6px 12px; background: #21262d; border: 1px solid #30363d; border-radius: 16px; font-size: 0.85rem; }
.guess-chip.correct { background: #1a3d2a; border-color: #2ea043; color: #2ea043; }
.guess-chip.revealed { background: #3d1a1a; border-color: #da3633; color: #da3633; }

#completion-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 999; }
#completion-modal.visible { display: flex; }
#completion-content { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 40px; text-align: center; }
#restart-btn { margin-top: 16px; padding: 10px 24px; background: {{ACCENT_COLOR}}; border: none; border-radius: 6px; color: #fff; cursor: pointer; }

// === AUDIO ENGINE ===
let audioCtx = null;
let currentSource = null;
let isPlaying = false;

function getAudioContext() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

async function playAudio(url) {
  const ctx = getAudioContext();
  if (currentSource) { currentSource.stop(); currentSource = null; }
  const response = await fetch(url);
  const buffer = await ctx.decodeAudioData(await response.arrayBuffer());
  currentSource = ctx.createBufferSource();
  currentSource.buffer = buffer;
  currentSource.connect(ctx.destination);
  currentSource.start();
  isPlaying = true;
  currentSource.onended = () => { isPlaying = false; };
}

function stopAudio() {
  if (currentSource) { currentSource.stop(); currentSource = null; }
  isPlaying = false;
}

    <div class="question-card">
      <h2>Question ${idx + 1}</h2>
      <button class="play-btn" onclick="playAudio('${q.audioUrl}')">Play</button>
      <button class="play-btn" onclick="stopAudio()">Stop</button>
      <input class="guess-input" placeholder="Type your guess..." onkeydown="if(event.key==='Enter')submitGuess(this.value)">
      <div class="guess-list" id="guesses"></div>
    </div>
  `;
  document.getElementById('current-q').textContent = idx + 1;
