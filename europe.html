<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Europe Borders Network Quiz</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #0d1117;
  color: #e0e0e0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  overflow: hidden;
  height: 100vh;
  width: 100vw;
}

#header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 16px;
  background: rgba(13, 17, 23, 0.92);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid rgba(255,255,255,0.06);
  gap: 12px;
}

#header h1 {
  font-size: 16px;
  font-weight: 600;
  color: #5b9bd5;
  letter-spacing: 0.5px;
  white-space: nowrap;
}

#controls {
  display: flex;
  align-items: center;
  gap: 10px;
}

#size-toggle {
  padding: 5px 10px;
  border: 1px solid rgba(91, 155, 213, 0.4);
  border-radius: 6px;
  background: rgba(91, 155, 213, 0.1);
  color: #5b9bd5;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
}

#size-toggle:hover {
  background: rgba(91, 155, 213, 0.2);
}

#score {
  font-size: 13px;
  color: #aaa;
  white-space: nowrap;
}

#score .guessed { color: #5b9bd5; font-weight: 600; }
#score .revealed { color: #e07a5f; font-weight: 600; }

#network-container {
  width: calc(100vw - 240px);
  height: 100vh;
}

#sidebar {
  position: fixed;
  top: 0;
  right: 0;
  width: 240px;
  height: 100vh;
  padding: 52px 12px 12px;
  overflow-y: auto;
  background: rgba(13, 17, 23, 0.97);
  border-left: 1px solid rgba(255,255,255,0.06);
  z-index: 50;
}

#sidebar h2 {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #666;
  margin-bottom: 10px;
  padding: 0 4px;
}

#guess-panel {
  position: fixed;
  bottom: 24px;
  left: calc((100vw - 240px) / 2);
  transform: translateX(-50%);
  z-index: 200;
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 12px 20px;
  background: rgba(20, 24, 33, 0.95);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
}

#guess-panel.visible { display: flex; }
#guess-hint { font-size: 13px; color: #888; }
#attempts-display { font-size: 12px; color: #e07a5f; }

#reset-layout-btn {
  position: fixed;
  top: 52px;
  left: calc((100vw - 240px) / 2);
  transform: translateX(-50%);
  z-index: 100;
  padding: 8px 16px;
  border: 1px solid rgba(91, 155, 213, 0.4);
  border-radius: 8px;
  background: rgba(91, 155, 213, 0.1);
  color: #5b9bd5;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
}

#reset-layout-btn:hover {
  background: rgba(91, 155, 213, 0.2);
}

#legend {
  position: fixed;
  bottom: 16px;
  left: 12px;
  z-index: 100;
  padding: 10px 12px;
  background: rgba(13, 17, 23, 0.9);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 10px;
  font-size: 11px;
  color: #aaa;
}

#legend .size-label { color: #5b9bd5; font-weight: 500; }

.name-btn {
  display: block;
  width: 100%;
  padding: 7px 10px;
  margin-bottom: 4px;
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 6px;
  background: rgba(255,255,255,0.02);
  color: #ccc;
  font-size: 13px;
  text-align: left;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}

.name-btn:hover {
  background: rgba(255,255,255,0.06);
  border-color: rgba(255,255,255,0.15);
}

.name-btn.selected-node-active {
  border-color: #5b9bd5;
  background: rgba(91, 155, 213, 0.08);
}

.name-btn.used-correct {
  background: rgba(91, 155, 213, 0.08);
  border-color: rgba(91, 155, 213, 0.25);
  color: rgba(91, 155, 213, 0.6);
  cursor: default;
  text-decoration: line-through;
  opacity: 0.5;
}

.name-btn.used-failed {
  background: rgba(224, 122, 95, 0.08);
  border-color: rgba(224, 122, 95, 0.2);
  color: rgba(224, 122, 95, 0.6);
  cursor: default;
  text-decoration: line-through;
  opacity: 0.5;
}

.name-btn.wrong-flash {
  animation: shake 0.4s ease;
  border-color: #e07a5f;
  background: rgba(224, 122, 95, 0.15);
}

#mobile-panel { display: none; }

#completion-modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 500;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(4px);
  justify-content: center;
  align-items: center;
}

#completion-modal.visible { display: flex; }

#completion-content {
  background: #161b22;
  padding: 32px;
  border-radius: 16px;
  text-align: center;
  border: 1px solid rgba(91, 155, 213, 0.2);
  margin: 20px;
}

#completion-content h2 { color: #5b9bd5; margin-bottom: 12px; font-size: 22px; }
#completion-content p { color: #ccc; margin-bottom: 8px; font-size: 15px; }

#restart-btn {
  margin-top: 20px;
  padding: 12px 24px;
  border: none;
  border-radius: 8px;
  background: #5b9bd5;
  color: #0d1117;
  font-weight: 600;
  font-size: 16px;
  cursor: pointer;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-6px); }
  40% { transform: translateX(6px); }
  60% { transform: translateX(-4px); }
  80% { transform: translateX(4px); }
}

@media (max-width: 768px) {
  body { display: flex; flex-direction: column; }
  #network-container { width: 100vw; height: 55vh; flex-shrink: 0; }
  #sidebar { display: none; }
  #guess-panel { display: none !important; }
  #reset-layout-btn { left: 50%; top: 48px; }
  #legend { bottom: auto; top: 48px; left: 8px; padding: 6px 8px; font-size: 10px; }

  #mobile-panel {
    display: flex;
    flex-direction: column;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 45vh;
    background: #161b22;
    border-top: 2px solid rgba(91, 155, 213, 0.3);
    z-index: 300;
  }

  #mobile-hint {
    padding: 10px 14px 6px;
    font-size: 13px;
    color: #aaa;
    flex-shrink: 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }

  #mobile-hint .attempts { color: #e07a5f; margin-left: 8px; }

  #mobile-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 10px;
    -webkit-overflow-scrolling: touch;
  }

  #mobile-list .name-btn {
    padding: 14px 14px;
    margin-bottom: 6px;
    font-size: 16px;
    min-height: 48px;
    border-radius: 8px;
  }
}
</style>
</head>
<body>

<div id="header">
  <h1>Europe Borders Quiz</h1>
  <div id="controls">
    <button id="size-toggle">Size: Population</button>
    <div id="score">
      <span class="guessed">0</span> / <span id="total-count">0</span> &nbsp;|&nbsp;
      <span class="revealed">0 failed</span>
    </div>
  </div>
</div>

<div id="network-container"></div>

<div id="sidebar">
  <h2>Countries</h2>
  <div id="sidebar-list"></div>
</div>

<div id="guess-panel">
  <div id="guess-hint">Click a node, then pick a name</div>
  <div id="attempts-display"></div>
</div>

<button id="reset-layout-btn">Reset Layout</button>

<div id="legend">
  Node size = <span class="size-label">Population</span><br>
  Edges = shared borders<br>
  Colours = flag palette
</div>

<div id="mobile-panel">
  <div id="mobile-hint">Tap a node, then pick a country below</div>
  <div id="mobile-list"></div>
</div>

<div id="completion-modal">
  <div id="completion-content">
    <h2>Quiz Complete!</h2>
    <p id="final-score"></p>
    <p id="final-accuracy"></p>
    <button id="restart-btn" onclick="location.reload()">Play Again</button>

</div>

function isMobile() {
  return window.matchMedia('(max-width: 768px)').matches;
}

let sizeMode = 'pop';

function flagPieSvg(colors, diameter) {
  const r = diameter / 2;
  let paths = '';
  let startAngle = -Math.PI / 2;
  colors.forEach(c => {
    const endAngle = startAngle + c.f * 2 * Math.PI;
    const x1 = r + r * Math.cos(startAngle);
    const y1 = r + r * Math.sin(startAngle);
    const x2 = r + r * Math.cos(endAngle);
    const y2 = r + r * Math.sin(endAngle);
    const largeArc = c.f > 0.5 ? 1 : 0;
    if (c.f >= 0.999) {
      paths += `<circle cx="${r}" cy="${r}" r="${r}" fill="${c.hex}"/>`;
    } else {
      paths += `<path d="M${r},${r} L${x1},${y1} A${r},${r} 0 ${largeArc} 1 ${x2},${y2} Z" fill="${c.hex}"/>`;
    }
    startAngle = endAngle;
  });
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${diameter}" height="${diameter}">${paths}</svg>`;
  return 'data:image/svg+xml,' + encodeURIComponent(svg);
}

const countryIds = new Set(COUNTRIES.map(c => c.id));
const filteredEdges = [];
const edgeSet = new Set();
COUNTRIES.forEach(c => {
  c.borders.forEach(b => {
    if (!countryIds.has(b)) return;
    const key = [c.id, b].sort().join('||');
    if (!edgeSet.has(key)) {
      edgeSet.add(key);
      filteredEdges.push({ source: c.id, target: b });
    }
  });
});

const pops = COUNTRIES.map(c => c.pop);
const gdps = COUNTRIES.map(c => c.gdp);
const sqrtMinPop = Math.sqrt(Math.min(...pops));
const sqrtMaxPop = Math.sqrt(Math.max(...pops));
const sqrtMinGdp = Math.sqrt(Math.min(...gdps.filter(g => g > 0)));
const sqrtMaxGdp = Math.sqrt(Math.max(...gdps));

function nodeSize(country) {
  if (sizeMode === 'pop') {
    const norm = (Math.sqrt(country.pop) - sqrtMinPop) / (sqrtMaxPop - sqrtMinPop);
    return 14 + norm * 46;
  } else {
    const val = Math.max(country.gdp, 0.1);
    const norm = (Math.sqrt(val) - sqrtMinGdp) / (sqrtMaxGdp - sqrtMinGdp);
    return 14 + norm * 46;
  }
}

let gameState = {
  revealed: new Set(),
  guessedCorrectly: new Set(),
  failedReveal: new Set(),
  selectedNode: null,
  attempts: {},
  totalGuesses: 0
};

document.getElementById('total-count').textContent = COUNTRIES.length;

const nodes = new vis.DataSet(COUNTRIES.map(c => ({
  id: c.id,
  label: ' ',
  size: nodeSize(c),
  shape: 'circularImage',
  image: flagPieSvg(c.flag, 100),
  borderWidth: 2,
  borderWidthSelected: 3,
  color: {
    border: 'rgba(255,255,255,0.15)',
    highlight: { border: '#fff' },
    hover: { border: 'rgba(255,255,255,0.4)' }
  },
  font: { color: 'transparent', size: 0 }
})));

const edges = new vis.DataSet(filteredEdges.map((e, i) => ({
  id: i,
  from: e.source,
  to: e.target,
  width: 1.5,
  color: { color: 'rgba(255,255,255,0.1)', highlight: 'rgba(255,255,255,0.35)' },
  smooth: { type: 'continuous' }
})));

const container = document.getElementById('network-container');
const network = new vis.Network(container, { nodes, edges }, {
  physics: {
    solver: 'forceAtlas2Based',
    forceAtlas2Based: {
      gravitationalConstant: -150,
      centralGravity: 0.008,
      springLength: 180,
      springConstant: 0.04,
      damping: 0.4
    },
    stabilization: { iterations: 2500, updateInterval: 25 }
  },
  interaction: {
    hover: true,
    tooltipDelay: 300,
    zoomView: true,
    dragView: true,
    dragNodes: true
  }
});

network.once('stabilizationIterationsDone', () => {
  network.setOptions({ physics: { enabled: false } });
});

// Size toggle
document.getElementById('size-toggle').addEventListener('click', () => {
  sizeMode = sizeMode === 'pop' ? 'gdp' : 'pop';
  document.getElementById('size-toggle').textContent = sizeMode === 'pop' ? 'Size: Population' : 'Size: GDP';
  document.querySelectorAll('.size-label').forEach(el => el.textContent = sizeMode === 'pop' ? 'Population' : 'GDP');
  COUNTRIES.forEach(c => {
    if (!gameState.revealed.has(c.id)) {
      nodes.update({ id: c.id, size: nodeSize(c) });
    }
  });
});

// Build name lists
const sortedNames = COUNTRIES.map(c => c.id).sort((a, b) => a.localeCompare(b));
const btnHtml = sortedNames.map(name =>
  `<button class="name-btn" data-name="${name}">${name}</button>`
).join('');

const sidebarList = document.getElementById('sidebar-list');
sidebarList.innerHTML = btnHtml;

const mobileList = document.getElementById('mobile-list');
mobileList.innerHTML = btnHtml;

function handleNameClick(e) {
  const btn = e.target.closest('.name-btn');
  if (!btn || btn.classList.contains('used-correct') || btn.classList.contains('used-failed')) return;
  submitGuess(btn.dataset.name, btn);
}

sidebarList.addEventListener('click', handleNameClick);
mobileList.addEventListener('click', handleNameClick);

// Network click
network.on('click', (params) => {
  if (params.nodes.length === 0) {
    if (isMobile()) { gameState.selectedNode = null; }
    else { deselectNode(); }
    return;
  }
  const nodeId = params.nodes[0];
  if (gameState.revealed.has(nodeId)) return;
  selectNode(nodeId);
});

network.on('dragEnd', (params) => {
  if (params.nodes.length > 0) {
    const nodeId = params.nodes[0];
    if (!gameState.revealed.has(nodeId)) selectNode(nodeId);
  }
});

function selectNode(nodeId) {
  gameState.selectedNode = nodeId;

  const country = COUNTRIES.find(c => c.id === nodeId);
  const borderCount = country.borders.filter(b => countryIds.has(b)).length;
  const connectedRevealed = getRevealedNeighbours(nodeId);
  const hintText = `${borderCount} border${borderCount !== 1 ? 's' : ''}` + (connectedRevealed.length > 0 ? ` · borders: ${connectedRevealed.join(', ')}` : '');
  const attempts = gameState.attempts[nodeId] || 0;
  const attText = attempts > 0 ? `Attempts: ${attempts}/3` : '';

  if (isMobile()) {
    document.getElementById('mobile-hint').innerHTML = hintText + (attText ? ` <span class="attempts">${attText}</span>` : '');
  } else {
    document.getElementById('guess-hint').textContent = hintText + ' — pick a name';
    document.getElementById('attempts-display').textContent = attText;
    document.getElementById('guess-panel').classList.add('visible');
    document.querySelectorAll('#sidebar-list .name-btn').forEach(btn => {
      if (!btn.classList.contains('used-correct') && !btn.classList.contains('used-failed')) {
        btn.classList.add('selected-node-active');
      }
    });
  }
}

function deselectNode() {
  gameState.selectedNode = null;
  document.getElementById('guess-panel').classList.remove('visible');
  document.querySelectorAll('#sidebar-list .name-btn').forEach(btn => btn.classList.remove('selected-node-active'));
}

function getRevealedNeighbours(nodeId) {
  const neighbours = [];
  filteredEdges.forEach(e => {
    if (e.source === nodeId && gameState.revealed.has(e.target)) neighbours.push(e.target);
    if (e.target === nodeId && gameState.revealed.has(e.source)) neighbours.push(e.source);
  });
  return neighbours;
}

function submitGuess(guessedName, btn) {
  const nodeId = gameState.selectedNode;
  if (!nodeId) return;

  const country = COUNTRIES.find(c => c.id === nodeId);
  gameState.totalGuesses++;

  if (guessedName === country.id) {
    revealNode(nodeId, true);
    markUsed(guessedName, 'used-correct');
    if (isMobile()) { gameState.selectedNode = null; }
    else deselectNode();
  } else {
    gameState.attempts[nodeId] = (gameState.attempts[nodeId] || 0) + 1;
    btn.classList.add('wrong-flash');
    setTimeout(() => btn.classList.remove('wrong-flash'), 400);

    if (isMobile()) {
      document.getElementById('mobile-hint').innerHTML = `Attempts: ${gameState.attempts[nodeId]}/3`;
    } else {
      document.getElementById('attempts-display').textContent = `Attempts: ${gameState.attempts[nodeId]}/3`;
    }

    if (gameState.attempts[nodeId] >= 3) {
      revealNode(nodeId, false);
      markUsed(country.id, 'used-failed');
      if (isMobile()) { gameState.selectedNode = null; }
      else deselectNode();
    }
  }
}

function markUsed(name, cls) {
  document.querySelectorAll(`.name-btn[data-name="${name}"]`).forEach(btn => {
    btn.classList.add(cls);
    btn.classList.remove('selected-node-active');
  });
}

function revealNode(nodeId, guessedCorrectly) {
  gameState.revealed.add(nodeId);
  const country = COUNTRIES.find(c => c.id === nodeId);

  if (guessedCorrectly) {
    gameState.guessedCorrectly.add(nodeId);
    nodes.update({
      id: nodeId,
      label: country.id,
      font: { color: '#fff', size: 12, strokeWidth: 1, strokeColor: 'rgba(0,0,0,0.4)' },
      opacity: 0.4,
      borderWidth: 1,
      color: { border: 'rgba(255,255,255,0.1)', highlight: { border: '#fff' }, hover: { border: '#fff' } }
    });
  } else {
    gameState.failedReveal.add(nodeId);
    nodes.update({
      id: nodeId,
      label: country.id,
      font: { color: 'rgba(255,255,255,0.6)', size: 11, strokeWidth: 1, strokeColor: 'rgba(0,0,0,0.3)' },
      opacity: 0.35,
      borderWidth: 1,
      color: { border: 'rgba(224, 122, 95, 0.4)', highlight: { border: 'rgba(224,122,95,0.7)' }, hover: { border: 'rgba(224,122,95,0.7)' } }
    });
  }

  highlightRemaining();
  updateScore();
  checkCompletion();
}

function highlightRemaining() {
  const remaining = COUNTRIES.filter(c => !gameState.revealed.has(c.id));
  if (remaining.length <= 5 && remaining.length > 0) {
    remaining.forEach(c => {
      nodes.update({
        id: c.id,
        borderWidth: 3,
        color: {
          border: '#5b9bd5',
          highlight: { border: '#fff' },
          hover: { border: '#5b9bd5' }
        },
        shadow: { enabled: true, color: 'rgba(91, 155, 213, 0.4)', size: 20 }
      });
    });
  }
}

function updateScore() {
  const scoreEl = document.getElementById('score');
  scoreEl.innerHTML = `<span class="guessed">${gameState.guessedCorrectly.size}</span> / <span id="total-count">${COUNTRIES.length}</span> &nbsp;|&nbsp; <span class="revealed">${gameState.failedReveal.size} failed</span>`;
}

function checkCompletion() {
  if (gameState.revealed.size === COUNTRIES.length) {
    document.getElementById('final-score').textContent = `You guessed ${gameState.guessedCorrectly.size} out of ${COUNTRIES.length} countries correctly.`;
    document.getElementById('final-accuracy').textContent = `Total guesses made: ${gameState.totalGuesses}`;
    document.getElementById('completion-modal').classList.add('visible');
  }
}

document.getElementById('reset-layout-btn').addEventListener('click', () => {
  network.setOptions({
    physics: {
      enabled: true,
      solver: 'forceAtlas2Based',
      forceAtlas2Based: { gravitationalConstant: -150, centralGravity: 0.008, springLength: 180, springConstant: 0.04, damping: 0.4 },
      stabilization: { iterations: 1000, updateInterval: 25 }
    }
  });
  network.stabilize(1000);
  network.once('stabilizationIterationsDone', () => {
    network.setOptions({ physics: { enabled: false } });
  });
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (isMobile()) { gameState.selectedNode = null; }
    else deselectNode();
  }
});
</script>
</body>
</html>
