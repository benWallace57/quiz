<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pokémon Gen 1 Network Quiz</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #0d1117;
  color: #e0e0e0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  overflow: hidden;
  height: 100vh;
  width: 100vw;
}

#header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 16px;
  background: rgba(13, 17, 23, 0.92);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid rgba(255,255,255,0.06);
  gap: 12px;
}

#header h1 {
  font-size: 16px;
  font-weight: 600;
  color: #e85d5d;
  letter-spacing: 0.5px;
  white-space: nowrap;
}

#score {
  font-size: 13px;
  color: #aaa;
  white-space: nowrap;
}

#score .guessed { color: #e85d5d; font-weight: 600; }
#score .revealed { color: #e07a5f; font-weight: 600; }

#network-container {
  width: calc(100vw - 240px);
  height: 100vh;
}

#sidebar {
  position: fixed;
  top: 0;
  right: 0;
  width: 240px;
  height: 100vh;
  padding: 52px 12px 12px;
  overflow-y: auto;
  background: rgba(13, 17, 23, 0.97);
  border-left: 1px solid rgba(255,255,255,0.06);
  z-index: 50;
}

#sidebar h2 {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #666;
  margin-bottom: 10px;
  padding: 0 4px;
}

#sidebar-search {
  width: 100%;
  padding: 8px 10px;
  margin-bottom: 10px;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 6px;
  background: rgba(255,255,255,0.03);
  color: #e0e0e0;
  font-size: 13px;
  outline: none;
}

#sidebar-search:focus {
  border-color: rgba(232, 93, 93, 0.4);
}

#guess-panel {
  position: fixed;
  bottom: 24px;
  left: calc((100vw - 240px) / 2);
  transform: translateX(-50%);
  z-index: 200;
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 12px 20px;
  background: rgba(20, 24, 33, 0.95);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
}

#guess-panel.visible { display: flex; }
#guess-hint { font-size: 13px; color: #888; }
#attempts-display { font-size: 12px; color: #e07a5f; }

#reset-layout-btn {
  position: fixed;
  top: 52px;
  left: calc((100vw - 240px) / 2);
  transform: translateX(-50%);
  z-index: 100;
  padding: 8px 16px;
  border: 1px solid rgba(232, 93, 93, 0.4);
  border-radius: 8px;
  background: rgba(232, 93, 93, 0.1);
  color: #e85d5d;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
}

#reset-layout-btn:hover {
  background: rgba(232, 93, 93, 0.2);
}

#legend {
  position: fixed;
  bottom: 16px;
  left: 12px;
  z-index: 100;
  padding: 10px 12px;
  background: rgba(13, 17, 23, 0.9);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 10px;
  font-size: 11px;
  color: #aaa;
  line-height: 1.6;
}

#legend .accent { color: #e85d5d; font-weight: 500; }

.name-btn {
  display: block;
  width: 100%;
  padding: 7px 10px;
  margin-bottom: 4px;
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 6px;
  background: rgba(255,255,255,0.02);
  color: #ccc;
  font-size: 13px;
  text-align: left;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}

.name-btn:hover {
  background: rgba(255,255,255,0.06);
  border-color: rgba(255,255,255,0.15);
}

.name-btn.selected-node-active {
  border-color: #e85d5d;
  background: rgba(232, 93, 93, 0.08);
}

.name-btn.used-correct {
  background: rgba(232, 93, 93, 0.08);
  border-color: rgba(232, 93, 93, 0.25);
  color: rgba(232, 93, 93, 0.6);
  cursor: default;
  text-decoration: line-through;
  opacity: 0.5;
}

.name-btn.used-failed {
  background: rgba(224, 122, 95, 0.08);
  border-color: rgba(224, 122, 95, 0.2);
  color: rgba(224, 122, 95, 0.6);
  cursor: default;
  text-decoration: line-through;
  opacity: 0.5;
}

.name-btn.wrong-flash {
  animation: shake 0.4s ease;
  border-color: #e07a5f;
  background: rgba(224, 122, 95, 0.15);
}

.name-btn.type-btn {
  border-left: 3px solid;
  font-weight: 500;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

#mobile-panel { display: none; }

#completion-modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 500;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(4px);
  justify-content: center;
  align-items: center;
}

#completion-modal.visible { display: flex; }

#completion-content {
  background: #161b22;
  padding: 32px;
  border-radius: 16px;
  text-align: center;
  border: 1px solid rgba(232, 93, 93, 0.2);
  margin: 20px;
}

#completion-content h2 { color: #e85d5d; margin-bottom: 12px; font-size: 22px; }
#completion-content p { color: #ccc; margin-bottom: 8px; font-size: 15px; }

#restart-btn {
  margin-top: 20px;
  padding: 12px 24px;
  border: none;
  border-radius: 8px;
  background: #e85d5d;
  color: #0d1117;
  font-weight: 600;
  font-size: 16px;
  cursor: pointer;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-6px); }
  40% { transform: translateX(6px); }
  60% { transform: translateX(-4px); }
  80% { transform: translateX(4px); }
}

@media (max-width: 768px) {
  body { display: flex; flex-direction: column; }
  #network-container { width: 100vw; height: 55vh; flex-shrink: 0; }
  #sidebar { display: none; }
  #guess-panel { display: none !important; }
  #reset-layout-btn { left: 50%; top: 48px; }
  #legend { bottom: auto; top: 48px; left: 8px; padding: 6px 8px; font-size: 10px; }

  #mobile-panel {
    display: flex;
    flex-direction: column;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 45vh;
    background: #161b22;
    border-top: 2px solid rgba(232, 93, 93, 0.3);
    z-index: 300;
  }

  #mobile-hint {
    padding: 10px 14px 6px;
    font-size: 13px;
    color: #aaa;
    flex-shrink: 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }

  #mobile-hint .attempts { color: #e07a5f; margin-left: 8px; }

  #mobile-search {
    margin: 8px 10px 4px;
    padding: 10px 12px;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px;
    background: rgba(255,255,255,0.03);
    color: #e0e0e0;
    font-size: 14px;
    outline: none;
  }

  #mobile-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 10px;
    -webkit-overflow-scrolling: touch;
  }

  #mobile-list .name-btn {
    padding: 14px 14px;
    margin-bottom: 6px;
    font-size: 16px;
    min-height: 48px;
    border-radius: 8px;
  }
}
</style>
</head>
<body>

<div id="header">
  <h1>Pokémon Gen 1 Network Quiz</h1>
  <div id="score">
    <span class="guessed">0</span> / <span id="total-count">166</span> &nbsp;|&nbsp;
    <span class="revealed">0 failed</span>
  </div>
</div>

<div id="network-container"></div>

<div id="sidebar">
  <h2>Pokémon & Types</h2>
  <input type="text" id="sidebar-search" placeholder="Search..." autocomplete="off">
  <div id="sidebar-list"></div>
</div>

<div id="guess-panel">
  <div id="guess-hint">Click a node, then pick a name</div>
  <div id="attempts-display"></div>
</div>

<button id="reset-layout-btn">Reset Layout</button>

<div id="legend">
  <span class="accent">●</span> Pie chart = sprite colours<br>
  <span class="accent">■</span> Squares = types<br>
  <span class="accent">→</span> Arrows = evolution<br>
  Size = base stat total
</div>

<div id="mobile-panel">
  <div id="mobile-hint">Tap a node, then pick a name below</div>
  <input type="text" id="mobile-search" placeholder="Search..." autocomplete="off">
  <div id="mobile-list"></div>
</div>

<div id="completion-modal">
  <div id="completion-content">
    <h2>Quiz Complete!</h2>
    <p id="final-score"></p>
    <p id="final-accuracy"></p>
    <button id="restart-btn" onclick="location.reload()">Play Again</button>
  </div>
</div>

function pieSvg(colors, diameter) {
  const r = diameter / 2;
  let paths = '';
  let startAngle = -Math.PI / 2;
  colors.forEach(c => {
    const endAngle = startAngle + c.f * 2 * Math.PI;
    const x1 = r + r * Math.cos(startAngle);
    const y1 = r + r * Math.sin(startAngle);
    const x2 = r + r * Math.cos(endAngle);
    const y2 = r + r * Math.sin(endAngle);
    const largeArc = c.f > 0.5 ? 1 : 0;
    if (c.f >= 0.999) {
      paths += `<circle cx="${r}" cy="${r}" r="${r}" fill="${c.hex}"/>`;
    } else if (c.f > 0.001) {
      paths += `<path d="M${r},${r} L${x1},${y1} A${r},${r} 0 ${largeArc} 1 ${x2},${y2} Z" fill="${c.hex}"/>`;
    }
    startAngle = endAngle;
  });
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${diameter}" height="${diameter}">${paths}</svg>`;
  return 'data:image/svg+xml,' + encodeURIComponent(svg);
}

function isMobile() { return window.innerWidth <= 768; }

// Size normalization
const bsts = POKEMON.map(p => p.bst);
const sqrtMin = Math.sqrt(Math.min(...bsts));
const sqrtMax = Math.sqrt(Math.max(...bsts));

function pokemonSize(bst) {
  const norm = (Math.sqrt(bst) - sqrtMin) / (sqrtMax - sqrtMin);
  return 14 + norm * 40;
}

// Build all names for guessing (Pokemon + Types)
const allNames = [
  ...POKEMON.map(p => ({ id: 'p_' + p.id, name: p.name, isType: false })),
  ...TYPES.map(t => ({ id: 't_' + t, name: t.charAt(0).toUpperCase() + t.slice(1), isType: true }))
];
allNames.sort((a, b) => a.name.localeCompare(b.name));

// Game state
let gameState = {
  revealed: new Set(),
  guessedCorrectly: new Set(),
  failedReveal: new Set(),
  selectedNode: null,
  attempts: {},
  totalGuesses: 0
};

const totalNodes = POKEMON.length + TYPES.length;
document.getElementById('total-count').textContent = totalNodes;

// Create vis.js nodes
const nodeData = [];

// Type nodes (squares)
TYPES.forEach(t => {
  nodeData.push({
    id: 't_' + t,
    label: ' ',
    shape: 'square',
    size: 22,
    color: {
      background: TYPE_COLORS[t],
      border: 'rgba(255,255,255,0.2)',
      highlight: { background: TYPE_COLORS[t], border: '#fff' },
      hover: { background: TYPE_COLORS[t], border: 'rgba(255,255,255,0.5)' }

    borderWidth: 2,
    borderWidthSelected: 3
  });
});

// Pokemon nodes (circular pie charts)
POKEMON.forEach(p => {
  nodeData.push({
    id: 'p_' + p.id,
    label: ' ',
    shape: 'circularImage',
    image: pieSvg(p.colors, 100),
    size: pokemonSize(p.bst),
    borderWidth: 2,
    borderWidthSelected: 3,
    color: {
      border: 'rgba(255,255,255,0.15)',
      highlight: { border: '#fff' },
      hover: { border: 'rgba(255,255,255,0.4)' }
    },
    font: { color: 'transparent', size: 0 }
  });
});

// Create edges
const edgeData = [];

// Type edges (Pokemon -> Type)
POKEMON.forEach(p => {
  p.types.forEach(t => {
    edgeData.push({
      from: 'p_' + p.id,
      to: 't_' + t,
      color: { color: 'rgba(255,255,255,0.04)', hover: 'rgba(255,255,255,0.1)' },
      width: 0.5,
      smooth: { type: 'continuous' }
    });
  });
});

// Evolution edges (directional arrows)
EVOLUTIONS.forEach(e => {
  edgeData.push({
    from: 'p_' + e.from,
    to: 'p_' + e.to,
    arrows: { to: { enabled: true, scaleFactor: 0.6 } },
    color: { color: 'rgba(232, 93, 93, 0.3)', hover: 'rgba(232, 93, 93, 0.6)' },
    width: 2,
    dashes: [6, 4],
    smooth: { type: 'curvedCW', roundness: 0.15 }
  });
});

const nodes = new vis.DataSet(nodeData);
const edges = new vis.DataSet(edgeData);

const container = document.getElementById('network-container');
const network = new vis.Network(container, { nodes, edges }, {
  physics: {
    enabled: true,
    solver: 'forceAtlas2Based',
    forceAtlas2Based: {
      gravitationalConstant: -30,
      centralGravity: 0.005,
      springLength: 120,
      springConstant: 0.04,
      damping: 0.4
    },
    stabilization: { iterations: 2000, updateInterval: 50 }
  },
  interaction: {
    hover: true,
    tooltipDelay: 200,
    zoomView: true,
    dragView: true
  },
  edges: {
    selectionWidth: 0
  }
});

network.once('stabilizationIterationsDone', () => {
  network.setOptions({ physics: { enabled: false } });
});

// Reset layout button
document.getElementById('reset-layout-btn').addEventListener('click', () => {
  network.setOptions({ physics: { enabled: true, stabilization: { iterations: 1000 } } });
  setTimeout(() => network.setOptions({ physics: { enabled: false } }), 5000);
});

// Build sidebar and mobile list
function buildNameLists() {
  const sidebarList = document.getElementById('sidebar-list');
  const mobileList = document.getElementById('mobile-list');

  allNames.forEach(item => {
    const btn = document.createElement('button');
    btn.className = 'name-btn' + (item.isType ? ' type-btn' : '');
    btn.textContent = item.name;
    btn.dataset.nodeId = item.id;
    if (item.isType) {
      btn.style.borderLeftColor = TYPE_COLORS[item.name.toLowerCase()];
    }
    sidebarList.appendChild(btn);

    const mBtn = btn.cloneNode(true);
    mobileList.appendChild(mBtn);
  });
}
buildNameLists();

// Search filter
function setupSearch(inputId, listId) {
  const input = document.getElementById(inputId);
  if (!input) return;
  input.addEventListener('input', () => {
    const q = input.value.toLowerCase();
    const list = input.nextElementSibling || document.getElementById(listId);
    const buttons = (list || input.parentElement).querySelectorAll('.name-btn');
    buttons.forEach(btn => {
      btn.style.display = btn.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
  });
}
setupSearch('sidebar-search', 'sidebar-list');
setupSearch('mobile-search', 'mobile-list');

// Click handlers for name buttons
function handleGuess(e) {
  const btn = e.target.closest('.name-btn');
  if (!btn || btn.classList.contains('used-correct') || btn.classList.contains('used-failed')) return;
  if (!gameState.selectedNode) return;

  const guessedId = btn.dataset.nodeId;
  gameState.totalGuesses++;

  if (guessedId === gameState.selectedNode) {
    revealNode(gameState.selectedNode, true);
    markUsed(guessedId, true);
    deselectNode();
  } else {
    btn.classList.add('wrong-flash');
    setTimeout(() => btn.classList.remove('wrong-flash'), 400);

    if (!gameState.attempts[gameState.selectedNode]) gameState.attempts[gameState.selectedNode] = 0;
    gameState.attempts[gameState.selectedNode]++;

    if (gameState.attempts[gameState.selectedNode] >= 3) {
      revealNode(gameState.selectedNode, false);
      deselectNode();
    } else {
      updateHint();
    }
  }
}

document.getElementById('sidebar-list').addEventListener('click', handleGuess);
document.getElementById('mobile-list').addEventListener('click', handleGuess);

// Node selection
network.on('click', params => {
  if (params.nodes.length === 0) {
    deselectNode();
    return;
  }
  const nodeId = params.nodes[0];
  if (gameState.revealed.has(nodeId)) return;
  selectNode(nodeId);
});

network.on('dragEnd', params => {
  if (params.nodes.length > 0) {
    const nodeId = params.nodes[0];
    if (!gameState.revealed.has(nodeId)) selectNode(nodeId);
  }
});

function selectNode(nodeId) {
  gameState.selectedNode = nodeId;
  document.getElementById('guess-panel').classList.add('visible');
  updateHint();

  document.querySelectorAll('.name-btn').forEach(btn => {
    if (!btn.classList.contains('used-correct') && !btn.classList.contains('used-failed')) {
      btn.classList.add('selected-node-active');
    }
  });
}

function deselectNode() {
  gameState.selectedNode = null;
  document.getElementById('guess-panel').classList.remove('visible');
  document.querySelectorAll('.name-btn').forEach(btn => btn.classList.remove('selected-node-active'));
  if (isMobile()) {
    document.getElementById('mobile-hint').innerHTML = 'Tap a node, then pick a name below';
  }
}

function updateHint() {
  const nodeId = gameState.selectedNode;
  if (!nodeId) return;

  const connectedEdges = network.getConnectedEdges(nodeId);
  const connectedNodes = network.getConnectedNodes(nodeId);
  const revealedNeighbours = connectedNodes.filter(n => gameState.revealed.has(n));

  let hints = [];
  hints.push(`${connectedNodes.length} connections`);

  if (revealedNeighbours.length > 0) {
    const names = revealedNeighbours.map(n => {
      const nodeObj = nodes.get(n);
      return nodeObj ? nodeObj.label : '?';
    }).filter(l => l !== ' ');
    if (names.length > 0) hints.push('Near: ' + names.join(', '));
  }

  // Show if it's a type node (square) or pokemon (circle)
  const node = nodes.get(nodeId);
  if (node.shape === 'square') {
    hints.push('Type node');
  }

  const attempts = gameState.attempts[nodeId] || 0;
  const hintHtml = hints.join(' &middot; ');
  const attemptsHtml = attempts > 0 ? `Attempt ${attempts}/3` : '';

  if (isMobile()) {
    document.getElementById('mobile-hint').innerHTML = hintHtml +
      (attemptsHtml ? ` <span class="attempts">${attemptsHtml}</span>` : '');
  } else {
    document.getElementById('guess-hint').innerHTML = hintHtml;
    document.getElementById('attempts-display').textContent = attemptsHtml;
  }
}

function revealNode(nodeId, correct) {
  gameState.revealed.add(nodeId);
  if (correct) {
    gameState.guessedCorrectly.add(nodeId);
  } else {
    gameState.failedReveal.add(nodeId);
  }

  // Find the name
  let label = '';
  if (nodeId.startsWith('t_')) {
    const typeName = nodeId.replace('t_', '');
    label = typeName.charAt(0).toUpperCase() + typeName.slice(1);
  } else {
    const pokemonId = parseInt(nodeId.replace('p_', ''));
    const p = POKEMON.find(pk => pk.id === pokemonId);
    label = p ? p.name : '?';
  }

  const color = correct ? '#e85d5d' : '#e07a5f';
  nodes.update({
    id: nodeId,
    label: label,
    font: { color: color, size: 11, strokeWidth: 3, strokeColor: '#0d1117' },
    opacity: correct ? 0.85 : 0.5,
    borderWidth: correct ? 2 : 1,
    color: nodeId.startsWith('t_') ? {
      background: correct ? TYPE_COLORS[nodeId.replace('t_', '')] : 'rgba(100,100,100,0.5)',
      border: color
    } : {
      border: color,
      highlight: { border: color },
      hover: { border: color }
    }
  });

  if (!correct) markUsed(nodeId, false);
  updateScore();
  checkCompletion();
}

function markUsed(nodeId, correct) {
  document.querySelectorAll(`.name-btn[data-node-id="${nodeId}"]`).forEach(btn => {
    btn.classList.remove('selected-node-active');
    btn.classList.add(correct ? 'used-correct' : 'used-failed');
  });
}

function updateScore() {
  const guessed = gameState.guessedCorrectly.size;
  const failed = gameState.failedReveal.size;
  document.querySelector('#score .guessed').textContent = guessed;
  document.querySelector('#score .revealed').textContent = failed + ' failed';
}

function checkCompletion() {
  if (gameState.revealed.size >= totalNodes) {
    const guessed = gameState.guessedCorrectly.size;
    const accuracy = gameState.totalGuesses > 0 ?
      Math.round((guessed / gameState.totalGuesses) * 100) : 0;
    document.getElementById('final-score').textContent =
      `${guessed} / ${totalNodes} correctly guessed`;
    document.getElementById('final-accuracy').textContent =
      `Accuracy: ${accuracy}% (${gameState.totalGuesses} total guesses)`;
    document.getElementById('completion-modal').classList.add('visible');
  }

  // Highlight remaining when few left
  if (totalNodes - gameState.revealed.size <= 5) {
    highlightRemaining();
  }
}

function highlightRemaining() {
  nodeData.forEach(n => {
    if (!gameState.revealed.has(n.id)) {
      nodes.update({ id: n.id, borderWidth: 3, color: { ...nodes.get(n.id).color, border: '#fff' } });
    }
  });
}

// Escape to deselect
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') deselectNode();
});
</script>
</body>
</html>
