<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breaking Bad Network Quiz</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #1a1a2e;
  color: #e0e0e0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  overflow: hidden;
  height: 100vh;
  width: 100vw;
}

#header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 24px;
  background: rgba(26, 26, 46, 0.9);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid rgba(255,255,255,0.08);
}

#header h1 {
  font-size: 18px;
  font-weight: 600;
  color: #4ecca3;
  letter-spacing: 0.5px;
}

#score {
  font-size: 14px;
  color: #aaa;
}

#score .guessed { color: #4ecca3; font-weight: 600; }
#score .revealed { color: #e07a5f; font-weight: 600; }

#network-container {
  width: calc(100vw - 220px);
  height: 100vh;
}

#name-list {
  position: fixed;
  top: 0;
  right: 0;
  width: 220px;
  height: 100vh;
  padding: 56px 12px 12px;
  overflow-y: auto;
  background: rgba(20, 20, 40, 0.95);
  border-left: 1px solid rgba(255,255,255,0.08);
  z-index: 50;
}

#name-list h2 {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #666;
  margin-bottom: 10px;
  padding: 0 4px;
}

.name-btn {
  display: block;
  width: 100%;
  padding: 7px 10px;
  margin-bottom: 4px;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 6px;
  background: rgba(255,255,255,0.03);
  color: #ccc;
  font-size: 13px;
  text-align: left;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, transform 0.15s;
}

.name-btn:hover {
  background: rgba(255,255,255,0.08);
  border-color: rgba(255,255,255,0.2);
}

.name-btn.selected-node-active {
  border-color: #4ecca3;
  background: rgba(78, 204, 163, 0.1);
}

.name-btn.used-correct {
  background: rgba(78, 204, 163, 0.15);
  border-color: rgba(78, 204, 163, 0.4);
  color: #4ecca3;
  cursor: default;
  text-decoration: line-through;
  opacity: 0.6;
}

.name-btn.used-failed {
  background: rgba(224, 122, 95, 0.1);
  border-color: rgba(224, 122, 95, 0.3);
  color: #e07a5f;
  cursor: default;
  text-decoration: line-through;
  opacity: 0.6;
}

.name-btn.wrong-flash {
  animation: shake 0.4s ease;
  border-color: #e07a5f;
  background: rgba(224, 122, 95, 0.15);
}

#guess-panel {
  position: fixed;
  bottom: 24px;
  left: calc((100vw - 220px) / 2);
  transform: translateX(-50%);
  z-index: 200;
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 12px 20px;
  background: rgba(30, 30, 50, 0.95);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 12px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}

#guess-panel.visible {
  display: flex;
}

#guess-hint {
  font-size: 13px;
  color: #888;
}

#attempts-display {
  font-size: 12px;
  color: #e07a5f;
}

#completion-modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 500;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(4px);
  justify-content: center;
  align-items: center;
}

#completion-modal.visible {
  display: flex;
}

#completion-content {
  background: #1e1e3a;
  padding: 40px;
  border-radius: 16px;
  text-align: center;
  border: 1px solid rgba(255,255,255,0.1);
}

#completion-content h2 {
  color: #4ecca3;
  margin-bottom: 12px;
  font-size: 24px;
}

#completion-content p {
  color: #ccc;
  margin-bottom: 8px;
}

#restart-btn {
  margin-top: 20px;
  padding: 12px 24px;
  border: none;
  border-radius: 8px;
  background: #4ecca3;
  color: #1a1a2e;
  font-weight: 600;
  font-size: 16px;
  cursor: pointer;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-6px); }
  40% { transform: translateX(6px); }
  60% { transform: translateX(-4px); }
  80% { transform: translateX(4px); }
}

@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(78, 204, 163, 0.4); }
  50% { box-shadow: 0 0 0 8px rgba(78, 204, 163, 0); }
}

  1: { muted: 'rgba(27, 67, 50, 0.7)', bright: '#2d8a5e' },

const filteredEdges = EDGES.filter(e => charIds.has(e.source) && charIds.has(e.target));

const weights = CHARACTERS.map(c => c.weight);
const minWeight = Math.min(...weights);
const maxWeight = Math.max(...weights);
const sqrtMin = Math.sqrt(minWeight);
const sqrtMax = Math.sqrt(maxWeight);

const edgeWeights = filteredEdges.map(e => e.weight);
const minEdge = Math.min(...edgeWeights);
const maxEdge = Math.max(...edgeWeights);
const logMin = Math.log(minEdge);
const logMax = Math.log(maxEdge);

function nodeSize(weight) {
  const norm = (Math.sqrt(weight) - sqrtMin) / (sqrtMax - sqrtMin);
  return 12 + norm * 43;
}

function edgeWidth(weight) {
  const norm = (Math.log(weight) - logMin) / (logMax - logMin);
  return 0.5 + norm * 11.5;
}

  failedReveal: new Set(),
  selectedNode: null,
  attempts: {},

  label: ' ',
  size: nodeSize(c.weight),
  color: {
    background: COMMUNITY_COLORS[c.community].muted,
    border: 'rgba(255,255,255,0.1)',
    highlight: { background: COMMUNITY_COLORS[c.community].muted, border: '#fff' },
    hover: { background: COMMUNITY_COLORS[c.community].muted, border: 'rgba(255,255,255,0.4)' }

  font: { color: 'transparent', size: 0 },
  borderWidth: 2,
  borderWidthSelected: 3,
  shape: 'dot'
})));

  from: e.source,
  to: e.target,
  width: edgeWidth(e.weight),
  color: { color: 'rgba(255,255,255,0.12)', highlight: 'rgba(255,255,255,0.4)' },
  smooth: { type: 'continuous' }
})));

      centralGravity: 0.012,
      springLength: 120,
      springConstant: 0.06,
      damping: 0.4
    },
    stabilization: { iterations: 1500, updateInterval: 25 }
  },
  interaction: {
    hover: true,
    tooltipDelay: 300,
    zoomView: true,
    dragView: true,
    dragNodes: false
  }
});

network.once('stabilizationIterationsDone', () => {
  network.setOptions({ physics: false });
});

  const btn = e.target.closest('.name-btn');
  if (!btn || btn.classList.contains('used-correct') || btn.classList.contains('used-failed')) return;
  const guessedName = btn.dataset.name;
  submitGuess(guessedName, btn);
});

network.on('click', (params) => {
  if (params.nodes.length === 0) {
    deselectNode();
    return;
  }
  const nodeId = params.nodes[0];
  if (gameState.revealed.has(nodeId)) return;
  selectNode(nodeId);
});

  gameState.selectedNode = nodeId;
  const panel = document.getElementById('guess-panel');
  const hint = document.getElementById('guess-hint');
  const attDisplay = document.getElementById('attempts-display');

  const connectedRevealed = getRevealedNeighbours(nodeId);
  const totalConns = filteredEdges.filter(e => e.source === nodeId || e.target === nodeId).length;

  hint.textContent = `${totalConns} connections` + (connectedRevealed.length > 0 ? ` (linked to: ${connectedRevealed.join(', ')})` : '') + ' — pick a name from the list';

  const attempts = gameState.attempts[nodeId] || 0;
  attDisplay.textContent = attempts > 0 ? `Attempts: ${attempts}/3` : '';

  panel.classList.add('visible');

  document.querySelectorAll('.name-btn').forEach(btn => {
    if (!btn.classList.contains('used-correct') && !btn.classList.contains('used-failed')) {
      btn.classList.add('selected-node-active');
    }
  });
}

function deselectNode() {
  gameState.selectedNode = null;
  document.getElementById('guess-panel').classList.remove('visible');
  document.querySelectorAll('.name-btn').forEach(btn => btn.classList.remove('selected-node-active'));
}

function getRevealedNeighbours(nodeId) {
  const neighbours = [];
  filteredEdges.forEach(e => {
    if (e.source === nodeId && gameState.revealed.has(e.target)) neighbours.push(e.target);
    if (e.target === nodeId && gameState.revealed.has(e.source)) neighbours.push(e.source);
  });
  return neighbours;
}

function submitGuess(guessedName, btn) {
  const nodeId = gameState.selectedNode;
  if (!nodeId) return;

  const char = CHARACTERS.find(c => c.id === nodeId);
  gameState.totalGuesses++;

  if (guessedName === char.id) {
    revealNode(nodeId, true);
    btn.classList.add('used-correct');
    btn.classList.remove('selected-node-active');
    deselectNode();
  } else {
    gameState.attempts[nodeId] = (gameState.attempts[nodeId] || 0) + 1;
    btn.classList.add('wrong-flash');
    setTimeout(() => btn.classList.remove('wrong-flash'), 400);

    const attDisplay = document.getElementById('attempts-display');
    attDisplay.textContent = `Attempts: ${gameState.attempts[nodeId]}/3`;

    if (gameState.attempts[nodeId] >= 3) {
      revealNode(nodeId, false);
      const correctBtn = nameListEl.querySelector(`[data-name="${char.id}"]`);
      if (correctBtn) {
        correctBtn.classList.add('used-failed');
        correctBtn.classList.remove('selected-node-active');
      }
      deselectNode();
    }
  }
}

function revealNode(nodeId, guessedCorrectly) {
  gameState.revealed.add(nodeId);
  const char = CHARACTERS.find(c => c.id === nodeId);

  if (guessedCorrectly) {
    gameState.guessedCorrectly.add(nodeId);
    nodes.update({
      id: nodeId,
      label: char.id,
      color: {
        background: COMMUNITY_COLORS[char.community].bright,
        border: '#fff',
        highlight: { background: COMMUNITY_COLORS[char.community].bright, border: '#fff' },
        hover: { background: COMMUNITY_COLORS[char.community].bright, border: '#fff' }
      },
      font: { color: '#fff', size: 14, strokeWidth: 3, strokeColor: 'rgba(0,0,0,0.7)' },
      borderWidth: 3
    });
  } else {
    gameState.failedReveal.add(nodeId);
    nodes.update({
      id: nodeId,
      label: char.id,
      color: {
        background: COMMUNITY_COLORS[char.community].muted,
        border: 'rgba(224, 122, 95, 0.6)',
        highlight: { background: COMMUNITY_COLORS[char.community].muted, border: 'rgba(224, 122, 95, 0.8)' },
        hover: { background: COMMUNITY_COLORS[char.community].muted, border: 'rgba(224, 122, 95, 0.8)' }
      },
      font: { color: 'rgba(255,255,255,0.5)', size: 12, strokeWidth: 2, strokeColor: 'rgba(0,0,0,0.5)' },
      borderWidth: 2
    });
  }

  updateScore();
  checkCompletion();
}

function updateScore() {
  const scoreEl = document.getElementById('score');
  scoreEl.innerHTML = `<span class="guessed">Guessed: ${gameState.guessedCorrectly.size}</span> / ${CHARACTERS.length} &nbsp;|&nbsp; <span class="revealed">Failed: ${gameState.failedReveal.size}</span>`;
}

function checkCompletion() {
  if (gameState.revealed.size === CHARACTERS.length) {
    const modal = document.getElementById('completion-modal');
    document.getElementById('final-score').textContent = `You guessed ${gameState.guessedCorrectly.size} out of ${CHARACTERS.length} characters correctly.`;
    document.getElementById('final-accuracy').textContent = `Total guesses made: ${gameState.totalGuesses}`;
    modal.classList.add('visible');
  }
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') deselectNode();
});
</script>
</body>
</html>
