    const state = {
        audioElements: {},
        playTimers: {},
        progressIntervals: {},
        playing: new Set()
    };

    function getClipDuration() {
        return parseFloat(document.getElementById('clipDuration').value) || 10;
    }

    function stopAll() {
        for (const key of state.playing) {
            const audio = state.audioElements[key];
            if (audio) {
                audio.pause();
            }
        }
        for (const key in state.playTimers) {
            clearTimeout(state.playTimers[key]);
        }
        for (const key in state.progressIntervals) {
            clearInterval(state.progressIntervals[key]);
        }
        state.playing.clear();
        state.playTimers = {};
        state.progressIntervals = {};
        document.querySelectorAll('.playing').forEach(el => el.classList.remove('playing'));
        document.querySelectorAll('.progress-bar').forEach(el => el.style.width = '0%');
    }

    function playTrack(questionId, trackIdx) {
        const key = `${questionId}_${trackIdx}`;
        const audio = state.audioElements[key];
        if (!audio) return;

        const q = QUESTIONS.find(q => q.id === questionId);
        const track = q.tracks[trackIdx];
        const duration = getClipDuration();

        audio.currentTime = track.offset;
        audio.play().catch(() => {});

        state.playing.add(key);

        const btn = document.querySelector(`[data-track-key="${key}"]`);
        if (btn) btn.classList.add('playing');

        const progressBar = document.querySelector(`[data-progress-key="${key}"]`);

        if (state.playTimers[key]) clearTimeout(state.playTimers[key]);
        if (state.progressIntervals[key]) clearInterval(state.progressIntervals[key]);

        const startTime = Date.now();
        state.progressIntervals[key] = setInterval(() => {
            const elapsed = (Date.now() - startTime) / 1000;
            const pct = Math.min(100, (elapsed / duration) * 100);
            if (progressBar) progressBar.style.width = pct + '%';
        }, 50);

        state.playTimers[key] = setTimeout(() => {
            audio.pause();
            state.playing.delete(key);
            if (btn) btn.classList.remove('playing');
            clearInterval(state.progressIntervals[key]);
            if (progressBar) progressBar.style.width = '0%';
        }, duration * 1000);
    }

    function playAllTracks(questionId) {
        const q = QUESTIONS.find(q => q.id === questionId);
        if (!q) return;

        const allBtn = document.querySelector(`[data-play-all="${questionId}"]`);
        const isPlaying = allBtn && allBtn.classList.contains('playing');

        stopAll();

        if (isPlaying) return;

        if (allBtn) allBtn.classList.add('playing');

        for (let i = 0; i < q.tracks.length; i++) {
            playTrack(questionId, i);
        }

        const duration = getClipDuration();
        state.playTimers[`${questionId}_all`] = setTimeout(() => {
            if (allBtn) allBtn.classList.remove('playing');
        }, duration * 1000);
    }

    function adjustOffset(questionId, trackIdx, delta) {
        const q = QUESTIONS.find(q => q.id === questionId);
        const track = q.tracks[trackIdx];
        track.offset = Math.max(0, Math.min(29, track.offset + delta));
        const display = document.querySelector(`[data-offset-key="${questionId}_${trackIdx}"]`);
        if (display) display.textContent = track.offset.toFixed(1) + 's';
    }

    function exportOffsets() {
        const lines = QUESTIONS.map(q => {
            const offsets = q.tracks.map((t, i) => `${t.artist}: ${t.offset}`);
            return `${q.label} (${q.answer}): ${offsets.join(', ')}`;
        });
        const el = document.getElementById('exportOutput');
        el.textContent = lines.join('\n');
        el.style.display = 'block';
        navigator.clipboard.writeText(el.textContent).catch(() => {});
    }

    function toggleAnswer(questionId) {
        const badge = document.querySelector(`[data-answer="${questionId}"]`);
        if (badge) {
            badge.classList.toggle('revealed');
            const q = QUESTIONS.find(q => q.id === questionId);
            badge.textContent = badge.classList.contains('revealed') ? q.answer : 'Show Answer';
            for (let i = 0; i < q.tracks.length; i++) {
                const info = document.querySelector(`[data-info-key="${questionId}_${i}"]`);
                if (info) info.classList.toggle('hidden', !badge.classList.contains('revealed'));
            }
        }
    }

    function render() {
        const container = document.getElementById('questions');
        container.innerHTML = '';

        for (const q of QUESTIONS) {
            const card = document.createElement('div');
            card.className = 'question-card' + (q.id === 'example' ? ' example' : '');

            card.innerHTML = `
                <div class="question-header">
                    <span class="question-number">${q.label}</span>
                    <button class="play-all-btn" data-play-all="${q.id}" onclick="playAllTracks('${q.id}')">
                        &#9654; Play All 3
                    </button>
                    <button class="stop-btn" onclick="stopAll()">&#9632; Stop</button>
                    <div class="answer-area">
                        <span class="answer-badge" data-answer="${q.id}" onclick="toggleAnswer('${q.id}')">Show Answer</span>
                    </div>
                </div>
                <div class="tracks-container">
                    ${q.tracks.map((t, i) => `
                        <div class="track-row">
                            <button class="track-play-btn" data-track-key="${q.id}_${i}"
                                onclick="stopAll(); playTrack('${q.id}', ${i})">
                                &#9654;${i + 1}
                            </button>
                            <div class="track-info hidden" data-info-key="${q.id}_${i}">
                                <div class="track-title">${t.title}</div>
                                <div class="track-artist">${t.artist}</div>
                            </div>
                            <div class="offset-controls">
                                <button class="offset-btn" onclick="adjustOffset('${q.id}', ${i}, -5)">-5</button>
                                <button class="offset-btn" onclick="adjustOffset('${q.id}', ${i}, -1)">-1</button>
                                <span class="offset-display" data-offset-key="${q.id}_${i}">${t.offset.toFixed(1)}s</span>
                                <button class="offset-btn" onclick="adjustOffset('${q.id}', ${i}, 1)">+1</button>
                                <button class="offset-btn" onclick="adjustOffset('${q.id}', ${i}, 5)">+5</button>
                            </div>
                            <div class="progress-bar-container">
                                <div class="progress-bar" data-progress-key="${q.id}_${i}"></div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;

            container.appendChild(card);

            for (let i = 0; i < q.tracks.length; i++) {
                const key = `${q.id}_${i}`;
                const audio = new Audio();
                audio.crossOrigin = 'anonymous';
                audio.preload = 'auto';
                audio.src = q.tracks[i].url;
                state.audioElements[key] = audio;
            }
        }
    }

    render();
    </script>
</body>
</html>
