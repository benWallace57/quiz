<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mashup Quiz</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d1117;
            color: #e6edf3;
            min-height: 100vh;
            padding: 20px;
        }
        .back-link {
            display: block;
            max-width: 900px;
            margin: 0 auto 12px;
            color: #8b949e;
            text-decoration: none;
            font-size: 0.9em;
        }
        .back-link:hover { color: #e6edf3; }
        h1 {
            text-align: center;
            font-size: 2em;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #f0883e, #ff6b8b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            text-align: center;
            color: #8b949e;
            margin-bottom: 24px;
            font-size: 1.1em;
        }
        .master-controls {
            max-width: 900px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            flex-wrap: wrap;
        }
        .master-controls label {
            color: #8b949e;
            font-size: 0.9em;
        }
        .duration-input {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 4px;
            color: #e6edf3;
            padding: 4px 8px;
            width: 60px;
            font-size: 0.9em;
            text-align: center;
        }
        .stop-btn {
            background: #30363d;
            color: #e6edf3;
            border: 1px solid #484f58;
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 0.85em;
            cursor: pointer;
            transition: background 0.15s;
        }
        .stop-btn:hover { background: #484f58; }
        .question-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
            transition: border-color 0.2s;
        }
        .question-card.active { border-color: #f0883e; }
        .question-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }
        .question-number {
            font-weight: 700;
            font-size: 1.2em;
            color: #f0883e;
            min-width: 100px;
        }
        .play-all-btn {
            background: #238636;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }
        .play-all-btn:hover { background: #2ea043; }
        .play-all-btn.playing { background: #da3633; }
        .play-all-btn.playing:hover { background: #f85149; }
        .offset-controls {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
            margin-left: auto;
        }
        .offset-controls .label {
            color: #8b949e;
            font-size: 0.8em;
            margin-right: 4px;
        }
        .offset-btn {
            background: #21262d;
            color: #8b949e;
            border: 1px solid #30363d;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 0.8em;
            cursor: pointer;
            transition: all 0.15s;
        }
        .offset-btn:hover { background: #30363d; color: #e6edf3; }
        .offset-display {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 4px;
            padding: 4px 10px;
            font-size: 0.85em;
            font-family: monospace;
            min-width: 60px;
            text-align: center;
            color: #f0883e;
        }
        .track {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
        }
        .track-toggle {
            flex-shrink: 0;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #21262d;
            color: #e6edf3;
            border: 1px solid #30363d;
            font-size: 0.9em;
            cursor: pointer;
            transition: background 0.15s;
        }
        .track-toggle:hover { background: #30363d; }
        .track-time {
            flex-shrink: 0;
            font-family: monospace;
            font-size: 0.85em;
            color: #8b949e;
            min-width: 92px;
            text-align: center;
        }
        .timeline {
            position: relative;
            flex: 1;
            height: 28px;
            cursor: pointer;
            touch-action: none;
        }
        .timeline::before {
            content: '';
            position: absolute;
            left: 0; right: 0; top: 12px;
            height: 4px;
            background: #30363d;
            border-radius: 2px;
        }
        .timeline-clip {
            position: absolute;
            top: 6px;
            height: 16px;
            background: rgba(240, 136, 62, 0.25);
            border: 1px solid rgba(240, 136, 62, 0.6);
            border-radius: 3px;
            pointer-events: none;
        }
        .timeline-head {
            position: absolute;
            top: 2px;
            width: 2px;
            height: 24px;
            margin-left: -1px;
            background: #e6edf3;
            border-radius: 1px;
            pointer-events: none;
        }
        .track-error {
            color: #f85149;
            font-size: 0.9em;
        }
        .track-error code {
            background: #21262d;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .card-footer {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .answer-badge {
            background: #30363d;
            border: 1px solid #484f58;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 0.9em;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s;
        }
        .answer-badge:hover { background: #484f58; }
        .answer-badge.revealed {
            background: #238636;
            border-color: #238636;
            color: #fff;
        }
        .progress-bar-container {
            flex: 1;
            min-width: 120px;
            height: 4px;
            background: #21262d;
            border-radius: 2px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background: #f0883e;
            border-radius: 2px;
            width: 0%;
            transition: width 0.1s linear;
        }
    </style>
</head>
<body>
    <a class="back-link" href="../index.html">&larr; All quizzes</a>
    <h1>Mashup Quiz</h1>
    <p class="subtitle">Two songs, one track. Name both to score 2 points.</p>

    <div class="master-controls">
        <label>Clip length:</label>
        <input type="number" class="duration-input" id="clipLength" value="20" min="5" max="120" step="5">
        <label>s</label>
        <button class="stop-btn" style="margin-left:auto" onclick="exportOffsets()">Export Offsets</button>
        <button class="stop-btn" onclick="resetOffsets()">Reset Offsets</button>
    </div>
    <pre id="exportOutput" style="display:none;max-width:900px;margin:0 auto 16px;padding:12px 16px;background:#161b22;border:1px solid #30363d;border-radius:8px;color:#e6edf3;font-size:0.85em;white-space:pre-wrap;cursor:pointer;" onclick="navigator.clipboard.writeText(this.textContent);this.style.borderColor='#238636';setTimeout(()=>this.style.borderColor='#30363d',1000)"></pre>

    <div id="questions"></div>

    <script>
    // offset = clip start time, in seconds into the track.
    const QUESTIONS = [
        {
            id: 'H82j1NZfVoU',
            offset: 23,
            answer: 'Thomas the Tank Engine + The Fresh Prince of Bel-Air'
        },
        {
            id: 'fKyb3UXLXJg',
            offset: 14,
            answer: 'Toxic (Britney Spears) + Rolling in the Deep (Adele)'
        },
        {
            id: 'qwAfzYcXgXc',
            offset: 10,
            answer: 'Seven Nation Army (The White Stripes) + Sweet Dreams (Eurythmics)'
        },
        {
            id: 'eIf3b6meriM',
            offset: 0,
            answer: 'Baby (Justin Bieber) + Psychosocial (Slipknot)'
        },
        {
            id: 'DmtP1fbmIsQ',
            offset: 0,
            answer: 'Thunderstruck (AC/DC) + Ghostbusters (Ray Parker Jr.)'
        },
        {
            id: 'yJUHIWB73zU',
            offset: 0,
            answer: '22 (Taylor Swift) + Party in the U.S.A. (Miley Cyrus)'
        },
        {
            id: 'z8gHMJjDVYA',
            offset: 15,
            answer: 'Firework (Katy Perry) + Pompeii (Bastille)'
        }
    ];

    // Offsets tweaked on the page survive a reload on this device.
    // Use Export Offsets and paste the values above to make them permanent.
    const STORAGE_KEY = 'mashup-quiz-offsets';
    const DEFAULT_OFFSETS = Object.fromEntries(QUESTIONS.map(q => [q.id, q.offset]));
    try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        for (const q of QUESTIONS) {
            if (typeof saved[q.id] === 'number') q.offset = saved[q.id];
        }
    } catch (e) {}

    // Audio comes from mashup_audio/<id>.m4a — fetch it with
    // `python3 tools/download_mashup_audio.py`.
    const AUDIO_DIR = 'mashup_audio';

    const state = {
        audio: {},           // id -> HTMLAudioElement
        clipId: null,        // question whose timed clip is running
        raf: null
    };

    function fmtTime(s) {
        if (!isFinite(s)) s = 0;
        const m = Math.floor(s / 60);
        return `${m}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
    }

    function getClipLength() {
        return parseFloat(document.getElementById('clipLength').value) || 20;
    }

    function getQ(id) {
        return QUESTIONS.find(q => q.id === id);
    }

    const el = (attr, id) => document.querySelector(`[data-${attr}="${id}"]`);

    // ---- Audio players ----

    function setupAudio(q) {
        const audio = new Audio();
        audio.preload = 'auto';
        state.audio[q.id] = audio;

        audio.addEventListener('loadedmetadata', () => {
            audio.currentTime = q.offset;
            updateClipWindow(q.id);
            updateTrack(q.id);
        });
        audio.addEventListener('play', () => onPlay(q.id));
        audio.addEventListener('pause', () => onPause(q.id));
        audio.addEventListener('ended', () => onPause(q.id));
        audio.addEventListener('seeked', () => updateTrack(q.id));
        // Backup for the animation loop, which browsers throttle in background tabs.
        audio.addEventListener('timeupdate', () => checkClipEnd(q.id));
        const fail = () => {
            el('track', q.id).innerHTML = `<span class="track-error">Audio file missing &mdash;
                run <code>python3 tools/download_mashup_audio.py</code></span>`;
        };
        audio.addEventListener('error', fail);

        // Load the whole file into memory first: `python3 -m http.server`
        // doesn't support range requests, so streamed audio can't seek.
        el('time', q.id).textContent = 'Loading…';
        fetch(`${AUDIO_DIR}/${q.id}.m4a`)
            .then(r => { if (!r.ok) throw new Error(r.status); return r.blob(); })
            .then(blob => { audio.src = URL.createObjectURL(blob); })
            .catch(fail);
    }

    function onPlay(id) {
        // Only one mashup audible at a time.
        for (const otherId in state.audio) {
            if (otherId !== id) state.audio[otherId].pause();
        }
        document.querySelectorAll('.question-card.active').forEach(c => c.classList.remove('active'));
        el('card', id).classList.add('active');
        el('toggle', id).innerHTML = '&#10074;&#10074;';
        startLoop();
    }

    function onPause(id) {
        el('toggle', id).innerHTML = '&#9654;';
        if (state.clipId === id) endClip();
        updateTrack(id);
    }

    function startLoop() {
        if (state.raf) return;
        const tick = () => {
            let anyPlaying = false;
            for (const id in state.audio) {
                if (state.audio[id].paused) continue;
                anyPlaying = true;
                checkClipEnd(id);
                updateTrack(id);
            }
            state.raf = anyPlaying ? requestAnimationFrame(tick) : null;
        };
        state.raf = requestAnimationFrame(tick);
    }

    function checkClipEnd(id) {
        if (state.clipId !== id) return;
        const audio = state.audio[id];
        const q = getQ(id);
        const elapsed = audio.currentTime - q.offset;
        const bar = el('progress-key', id);
        bar.style.width = Math.max(0, Math.min(100, (elapsed / getClipLength()) * 100)) + '%';
        if (elapsed >= getClipLength()) audio.pause();
    }

    function updateTrack(id) {
        const audio = state.audio[id];
        const time = el('time', id);
        const head = el('head', id);
        if (!time || !head) return;
        time.textContent = `${fmtTime(audio.currentTime)} / ${fmtTime(audio.duration)}`;
        if (audio.duration) head.style.left = (audio.currentTime / audio.duration * 100) + '%';
    }

    function updateClipWindow(id) {
        const audio = state.audio[id];
        const win = el('clipwin', id);
        if (!win || !audio.duration) return;
        const q = getQ(id);
        const end = Math.min(audio.duration, q.offset + getClipLength());
        win.style.left = (q.offset / audio.duration * 100) + '%';
        win.style.width = ((end - q.offset) / audio.duration * 100) + '%';
    }

    function endClip() {
        const id = state.clipId;
        state.clipId = null;
        if (!id) return;
        const btn = el('play', id);
        btn.classList.remove('playing');
        btn.innerHTML = '&#9654; Play Clip';
        el('progress-key', id).style.width = '0%';
    }

    function playClip(id) {
        const audio = state.audio[id];
        if (!audio.duration) return; // still loading
        if (state.clipId === id) {
            audio.pause();
            return;
        }
        if (state.clipId) state.audio[state.clipId].pause();

        state.clipId = id;
        const btn = el('play', id);
        btn.classList.add('playing');
        btn.innerHTML = '&#9632; Stop';
        audio.currentTime = getQ(id).offset;
        audio.play().catch(() => endClip());
    }

    // Free play/pause from the current position (handy for finding offsets).
    function togglePlay(id) {
        const audio = state.audio[id];
        if (audio.paused) audio.play().catch(() => {});
        else audio.pause();
    }

    function setupTimeline(id) {
        const timeline = el('timeline', id);
        const seek = e => {
            const audio = state.audio[id];
            if (!audio.duration) return;
            const r = timeline.getBoundingClientRect();
            const frac = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
            // Scrubbing turns a timed clip into free playback.
            if (state.clipId === id) endClip();
            audio.currentTime = frac * audio.duration;
            updateTrack(id);
        };
        timeline.addEventListener('pointerdown', e => {
            timeline.setPointerCapture(e.pointerId);
            seek(e);
        });
        timeline.addEventListener('pointermove', e => {
            if (timeline.hasPointerCapture(e.pointerId)) seek(e);
        });
    }

    // ---- Offsets ----

    function saveOffsets() {
        const changed = {};
        for (const q of QUESTIONS) {
            if (q.offset !== DEFAULT_OFFSETS[q.id]) changed[q.id] = q.offset;
        }
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(changed)); } catch (e) {}
    }

    function setOffset(id, value) {
        const q = getQ(id);
        const audio = state.audio[id];
        const duration = audio.duration || Infinity;
        q.offset = Math.max(0, Math.min(Math.floor(duration) - 1, Math.round(value)));
        el('offset-key', id).textContent = fmtTime(q.offset);
        // Move the playhead to the new start unless the track is playing.
        if (audio.paused && audio.readyState > 0) audio.currentTime = q.offset;
        updateClipWindow(id);
        saveOffsets();
    }

    function adjustOffset(id, delta) {
        setOffset(id, getQ(id).offset + delta);
    }

    function useCurrentTime(id) {
        setOffset(id, state.audio[id].currentTime);
    }

    function resetOffsets() {
        if (!confirm('Reset all clip start times to the defaults in the file?')) return;
        try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
        for (const q of QUESTIONS) setOffset(q.id, DEFAULT_OFFSETS[q.id]);
    }

    function exportOffsets() {
        const lines = QUESTIONS.map((q, i) =>
            `Mashup ${i + 1} (${q.answer}): id '${q.id}', offset: ${q.offset}`
        );
        const out = document.getElementById('exportOutput');
        out.textContent = lines.join('\n');
        out.style.display = 'block';
        navigator.clipboard.writeText(out.textContent).catch(() => {});
    }
    // ---- Answers ----

    function toggleAnswer(id) {
        const badge = document.querySelector(`[data-answer="${id}"]`);
        const q = QUESTIONS.find(q => q.id === id);
        badge.classList.toggle('revealed');
        badge.textContent = badge.classList.contains('revealed') ? q.answer : 'Show Answer';
    }

    // ---- Render ----

    function render() {
        const container = document.getElementById('questions');
        QUESTIONS.forEach((q, i) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.dataset.card = q.id;
            card.innerHTML = `
                <div class="question-header">
                    <span class="question-number">Mashup ${i + 1}</span>
                    <button class="play-all-btn" data-play="${q.id}" onclick="playClip('${q.id}')">&#9654; Play Clip</button>
                    <div class="offset-controls" title="Clip start time">
                        <span class="label">Start</span>
                        <button class="offset-btn" onclick="adjustOffset('${q.id}', -5)">-5</button>
                        <button class="offset-btn" onclick="adjustOffset('${q.id}', -1)">-1</button>
                        <span class="offset-display" data-offset-key="${q.id}">${fmtTime(q.offset)}</span>
                        <button class="offset-btn" onclick="adjustOffset('${q.id}', 1)">+1</button>
                        <button class="offset-btn" onclick="adjustOffset('${q.id}', 5)">+5</button>
                        <button class="offset-btn" onclick="useCurrentTime('${q.id}')" title="Set the start to the playhead position">Use current</button>
                    </div>
                </div>
                <div class="track" data-track="${q.id}">
                    <button class="track-toggle" data-toggle="${q.id}" onclick="togglePlay('${q.id}')" title="Play / pause from the playhead">&#9654;</button>
                    <span class="track-time" data-time="${q.id}">0:00 / 0:00</span>
                    <div class="timeline" data-timeline="${q.id}" title="Click or drag to seek">
                        <div class="timeline-clip" data-clipwin="${q.id}"></div>
                        <div class="timeline-head" data-head="${q.id}"></div>
                    </div>
                </div>
                <div class="card-footer">
                    <span class="answer-badge" data-answer="${q.id}" onclick="toggleAnswer('${q.id}')">Show Answer</span>
                    <div class="progress-bar-container">
                        <div class="progress-bar" data-progress-key="${q.id}"></div>
                    </div>
                </div>
            `;
            container.appendChild(card);
            setupTimeline(q.id);
            setupAudio(q);
        });
        document.getElementById('clipLength').addEventListener('input', () => {
            QUESTIONS.forEach(q => updateClipWindow(q.id));
        });
    }

    render();
    </script>
</body>
</html>
