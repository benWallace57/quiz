<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mashup Quiz</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d1117;
            color: #e6edf3;
            min-height: 100vh;
            padding: 20px;
        }
        .back-link {
            display: block;
            max-width: 900px;
            margin: 0 auto 12px;
            color: #8b949e;
            text-decoration: none;
            font-size: 0.9em;
        }
        .back-link:hover { color: #e6edf3; }
        h1 {
            text-align: center;
            font-size: 2em;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #f0883e, #ff6b8b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            text-align: center;
            color: #8b949e;
            margin-bottom: 24px;
            font-size: 1.1em;
        }
        .master-controls {
            max-width: 900px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            flex-wrap: wrap;
        }
        .master-controls label {
            color: #8b949e;
            font-size: 0.9em;
        }
        .duration-input {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 4px;
            color: #e6edf3;
            padding: 4px 8px;
            width: 60px;
            font-size: 0.9em;
            text-align: center;
        }
        .stop-btn {
            background: #30363d;
            color: #e6edf3;
            border: 1px solid #484f58;
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 0.85em;
            cursor: pointer;
            transition: background 0.15s;
        }
        .stop-btn:hover { background: #484f58; }
        .question-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
            transition: border-color 0.2s;
        }
        .question-card.active { border-color: #f0883e; }
        .question-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }
        .question-number {
            font-weight: 700;
            font-size: 1.2em;
            color: #f0883e;
            min-width: 100px;
        }
        .play-all-btn {
            background: #238636;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }
        .play-all-btn:hover { background: #2ea043; }
        .play-all-btn.playing { background: #da3633; }
        .play-all-btn.playing:hover { background: #f85149; }
        .offset-controls {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
            margin-left: auto;
        }
        .offset-controls .label {
            color: #8b949e;
            font-size: 0.8em;
            margin-right: 4px;
        }
        .offset-btn {
            background: #21262d;
            color: #8b949e;
            border: 1px solid #30363d;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 0.8em;
            cursor: pointer;
            transition: all 0.15s;
        }
        .offset-btn:hover { background: #30363d; color: #e6edf3; }
        .offset-display {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 4px;
            padding: 4px 10px;
            font-size: 0.85em;
            font-family: monospace;
            min-width: 60px;
            text-align: center;
            color: #f0883e;
        }
        .player-frame {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }
        .player-frame iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }
        .card-footer {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .answer-badge {
            background: #30363d;
            border: 1px solid #484f58;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 0.9em;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s;
        }
        .answer-badge:hover { background: #484f58; }
        .answer-badge.revealed {
            background: #238636;
            border-color: #238636;
            color: #fff;
        }
        .progress-bar-container {
            flex: 1;
            min-width: 120px;
            height: 4px;
            background: #21262d;
            border-radius: 2px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background: #f0883e;
            border-radius: 2px;
            width: 0%;
            transition: width 0.1s linear;
        }
    </style>
</head>
<body>
    <a class="back-link" href="../index.html">&larr; All quizzes</a>
    <h1>Mashup Quiz</h1>
    <p class="subtitle">Two songs, one track. Name both to score 2 points.</p>

    <div class="master-controls">
        <label>Clip length:</label>
        <input type="number" class="duration-input" id="clipLength" value="20" min="5" max="120" step="5">
        <label>s</label>
        <button class="stop-btn" style="margin-left:auto" onclick="exportOffsets()">Export Offsets</button>
        <button class="stop-btn" onclick="resetOffsets()">Reset Offsets</button>
    </div>
    <pre id="exportOutput" style="display:none;max-width:900px;margin:0 auto 16px;padding:12px 16px;background:#161b22;border:1px solid #30363d;border-radius:8px;color:#e6edf3;font-size:0.85em;white-space:pre-wrap;cursor:pointer;" onclick="navigator.clipboard.writeText(this.textContent);this.style.borderColor='#238636';setTimeout(()=>this.style.borderColor='#30363d',1000)"></pre>

    <div id="questions"></div>

    <script>
    // offset = clip start time, in seconds into the YouTube video.
    const QUESTIONS = [
        {
            id: 'H82j1NZfVoU',
            offset: 20,
            answer: 'Thomas the Tank Engine + The Fresh Prince of Bel-Air'
        },
        {
            id: 'fKyb3UXLXJg',
            offset: 30,
            answer: 'Toxic (Britney Spears) + Rolling in the Deep (Adele)'
        },
        {
            id: 'qwAfzYcXgXc',
            offset: 30,
            answer: 'Seven Nation Army (The White Stripes) + Sweet Dreams (Eurythmics)'
        },
        {
            id: 'eIf3b6meriM',
            offset: 45,
            answer: 'Baby (Justin Bieber) + Psychosocial (Slipknot)'
        },
        {
            id: 'DmtP1fbmIsQ',
            offset: 30,
            answer: 'Thunderstruck (AC/DC) + Ghostbusters (Ray Parker Jr.)'
        },
        {
            id: 'yJUHIWB73zU',
            offset: 30,
            answer: '22 (Taylor Swift) + Party in the U.S.A. (Miley Cyrus)'
        },
        {
            id: 'z8gHMJjDVYA',
            offset: 30,
            answer: 'Firework (Katy Perry) + Pompeii (Bastille)'
        }
    ];

    // Offsets tweaked on the page survive a reload on this device.
    // Use Export Offsets and paste the values above to make them permanent.
    const STORAGE_KEY = 'mashup-quiz-offsets';
    const DEFAULT_OFFSETS = Object.fromEntries(QUESTIONS.map(q => [q.id, q.offset]));
    try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        for (const q of QUESTIONS) {
            if (typeof saved[q.id] === 'number') q.offset = saved[q.id];
        }
    } catch (e) {}

    const state = {
        players: {},
        clipId: null,        // question whose timed clip is running
        clipStartedAt: null, // wall clock time the clip actually started playing
        stopTimer: null,
        progressInterval: null
    };

    function fmtTime(s) {
        const m = Math.floor(s / 60);
        return `${m}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
    }

    function getClipLength() {
        return parseFloat(document.getElementById('clipLength').value) || 20;
    }

    // ---- YouTube players ----

    function onYouTubeIframeAPIReady() {
        for (const q of QUESTIONS) {
            state.players[q.id] = new YT.Player(`player_${q.id}`, {
                videoId: q.id,
                playerVars: { start: q.offset, playsinline: 1, rel: 0 },
                events: { onStateChange: e => onPlayerStateChange(q.id, e) }
            });
        }
    }

    function onPlayerStateChange(id, e) {
        if (e.data === YT.PlayerState.PLAYING) {
            // Only one mashup audible at a time.
            for (const otherId in state.players) {
                if (otherId !== id) state.players[otherId].pauseVideo?.();
            }
            document.querySelectorAll('.question-card.active').forEach(el => el.classList.remove('active'));
            document.querySelector(`[data-card="${id}"]`).classList.add('active');

            // Start the clip timer only once audio is actually playing,
            // so buffering doesn't eat into the clip.
            if (state.clipId === id && state.clipStartedAt === null) {
                state.clipStartedAt = Date.now();
                const duration = getClipLength();
                const bar = document.querySelector(`[data-progress-key="${id}"]`);
                state.progressInterval = setInterval(() => {
                    const elapsed = (Date.now() - state.clipStartedAt) / 1000;
                    if (bar) bar.style.width = Math.min(100, (elapsed / duration) * 100) + '%';
                }, 100);
                state.stopTimer = setTimeout(() => {
                    state.players[id].pauseVideo();
                    endClip();
                }, duration * 1000);
            }
        } else if (e.data === YT.PlayerState.PAUSED || e.data === YT.PlayerState.ENDED) {
            if (state.clipId === id && state.clipStartedAt !== null) endClip();
        }
    }

    function endClip() {
        clearTimeout(state.stopTimer);
        clearInterval(state.progressInterval);
        state.stopTimer = null;
        state.progressInterval = null;
        state.clipStartedAt = null;
        state.clipId = null;
        document.querySelectorAll('.play-all-btn.playing').forEach(el => {
            el.classList.remove('playing');
            el.innerHTML = '&#9654; Play Clip';
        });
        document.querySelectorAll('.progress-bar').forEach(el => el.style.width = '0%');
    }

    function playClip(id) {
        const player = state.players[id];
        if (!player || !player.seekTo) return;
        const wasPlaying = state.clipId === id;
        if (state.clipId) {
            state.players[state.clipId].pauseVideo();
            endClip();
        }
        if (wasPlaying) return;

        const q = QUESTIONS.find(q => q.id === id);
        state.clipId = id;
        const btn = document.querySelector(`[data-play="${id}"]`);
        btn.classList.add('playing');
        btn.innerHTML = '&#9632; Stop';
        player.seekTo(q.offset, true);
        player.playVideo();
    }

    // ---- Offsets ----

    function saveOffsets() {
        const changed = {};
        for (const q of QUESTIONS) {
            if (q.offset !== DEFAULT_OFFSETS[q.id]) changed[q.id] = q.offset;
        }
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(changed)); } catch (e) {}
    }

    function setOffset(id, value) {
        const q = QUESTIONS.find(q => q.id === id);
        const duration = state.players[id]?.getDuration?.() || Infinity;
        q.offset = Math.max(0, Math.min(Math.floor(duration) - 1, Math.round(value)));
        document.querySelector(`[data-offset-key="${id}"]`).textContent = fmtTime(q.offset);
        moveToOffset(id);
        saveOffsets();
    }

    // seekTo() would start an unstarted/cued video, so only seek once it has
    // been played; otherwise re-cue it at the new start point.
    function moveToOffset(id) {
        const player = state.players[id];
        if (!player || !player.getPlayerState) return;
        const q = QUESTIONS.find(q => q.id === id);
        const s = player.getPlayerState();
        if (s === YT.PlayerState.PLAYING || s === YT.PlayerState.PAUSED || s === YT.PlayerState.BUFFERING) {
            player.seekTo(q.offset, true);
        } else {
            player.cueVideoById({ videoId: id, startSeconds: q.offset });
        }
    }

    function adjustOffset(id, delta) {
        const q = QUESTIONS.find(q => q.id === id);
        setOffset(id, q.offset + delta);
    }

    function useCurrentTime(id) {
        const t = state.players[id]?.getCurrentTime?.();
        if (typeof t === 'number') setOffset(id, t);
    }

    function resetOffsets() {
        if (!confirm('Reset all clip start times to the defaults in the file?')) return;
        try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
        for (const q of QUESTIONS) setOffset(q.id, DEFAULT_OFFSETS[q.id]);
    }

    function exportOffsets() {
        const lines = QUESTIONS.map((q, i) =>
            `Mashup ${i + 1} (${q.answer}): id '${q.id}', offset: ${q.offset}`
        );
        const el = document.getElementById('exportOutput');
        el.textContent = lines.join('\n');
        el.style.display = 'block';
        navigator.clipboard.writeText(el.textContent).catch(() => {});
    }

    // ---- Answers ----

    function toggleAnswer(id) {
        const badge = document.querySelector(`[data-answer="${id}"]`);
        const q = QUESTIONS.find(q => q.id === id);
        badge.classList.toggle('revealed');
        badge.textContent = badge.classList.contains('revealed') ? q.answer : 'Show Answer';
    }

    // ---- Render ----

    function render() {
        const container = document.getElementById('questions');
        QUESTIONS.forEach((q, i) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.dataset.card = q.id;
            card.innerHTML = `
                <div class="question-header">
                    <span class="question-number">Mashup ${i + 1}</span>
                    <button class="play-all-btn" data-play="${q.id}" onclick="playClip('${q.id}')">&#9654; Play Clip</button>
                    <div class="offset-controls" title="Clip start time">
                        <span class="label">Start</span>
                        <button class="offset-btn" onclick="adjustOffset('${q.id}', -5)">-5</button>
                        <button class="offset-btn" onclick="adjustOffset('${q.id}', -1)">-1</button>
                        <span class="offset-display" data-offset-key="${q.id}">${fmtTime(q.offset)}</span>
                        <button class="offset-btn" onclick="adjustOffset('${q.id}', 1)">+1</button>
                        <button class="offset-btn" onclick="adjustOffset('${q.id}', 5)">+5</button>
                        <button class="offset-btn" onclick="useCurrentTime('${q.id}')" title="Set the start to where the video is now">Use current</button>
                    </div>
                </div>
                <div class="player-frame"><div id="player_${q.id}"></div></div>
                <div class="card-footer">
                    <span class="answer-badge" data-answer="${q.id}" onclick="toggleAnswer('${q.id}')">Show Answer</span>
                    <div class="progress-bar-container">
                        <div class="progress-bar" data-progress-key="${q.id}"></div>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    render();
    </script>
    <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
