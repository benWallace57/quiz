<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mashup Quiz</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d1117;
            color: #e6edf3;
            min-height: 100vh;
            padding: 20px;
        }
        .back-link {
            display: block;
            max-width: 900px;
            margin: 0 auto 12px;
            color: #8b949e;
            text-decoration: none;
            font-size: 0.9em;
        }
        .back-link:hover { color: #e6edf3; }
        h1 {
            text-align: center;
            font-size: 2em;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #f0883e, #ff6b8b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            text-align: center;
            color: #8b949e;
            margin-bottom: 24px;
            font-size: 1.1em;
        }
        .master-controls {
            max-width: 900px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            flex-wrap: wrap;
        }
        .master-controls label {
            color: #8b949e;
            font-size: 0.9em;
        }
        .duration-input {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 4px;
            color: #e6edf3;
            padding: 4px 8px;
            width: 60px;
            font-size: 0.9em;
            text-align: center;
        }
        .player-status {
            color: #8b949e;
            font-size: 0.85em;
        }
        .player-status.error { color: #f85149; }
        .stop-btn {
            background: #30363d;
            color: #e6edf3;
            border: 1px solid #484f58;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 1em;
            cursor: pointer;
            transition: background 0.15s;
        }
        .stop-btn:hover { background: #484f58; }
        .stop-btn.small { padding: 6px 12px; font-size: 0.85em; }

        /* The YouTube player has to stay rendered for the API to play it,
           so it sits behind an opaque cover that hides the video title. */
        .player-wrap {
            position: fixed;
            right: 16px;
            bottom: 16px;
            width: 200px;
            height: 200px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #30363d;
            z-index: 10;
        }
        .player-wrap iframe { width: 100%; height: 100%; }
        .player-cover {
            position: absolute;
            inset: 0;
            background: #161b22;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.9em;
            color: #8b949e;
            text-align: center;
            padding: 12px;
        }
        .player-cover .big { font-size: 2.4em; }
        .player-cover .now { color: #f0883e; font-weight: 600; display: block; }

        .question-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
            transition: border-color 0.2s;
        }
        .question-card.active { border-color: #f0883e; }
        .question-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .question-number {
            font-weight: 700;
            font-size: 1.2em;
            color: #f0883e;
            min-width: 100px;
        }
        .play-all-btn {
            background: #238636;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.15s;
        }
        .play-all-btn:hover { background: #2ea043; }
        .play-all-btn.playing { background: #da3633; }
        .play-all-btn.playing:hover { background: #f85149; }
        .offset-controls {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
            margin-left: auto;
        }
        .offset-btn {
            background: #21262d;
            color: #8b949e;
            border: 1px solid #30363d;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 0.8em;
            cursor: pointer;
            transition: all 0.15s;
        }
        .offset-btn:hover { background: #30363d; color: #e6edf3; }
        .offset-display {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 4px;
            padding: 4px 10px;
            font-size: 0.85em;
            font-family: monospace;
            min-width: 70px;
            text-align: center;
            color: #f0883e;
        }
        .songs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        @media (max-width: 600px) {
            .songs { grid-template-columns: 1fr; }
            .player-wrap { width: 120px; height: 120px; }
        }
        .song-slot {
            background: #0d1117;
            border: 2px solid transparent;
            border-radius: 8px;
            padding: 10px 14px;
            cursor: pointer;
            user-select: none;
            transition: border-color 0.2s;
        }
        .song-slot:hover { border-color: #30363d; }
        .song-slot .slot-label {
            font-size: 0.75em;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #8b949e;
            margin-bottom: 4px;
        }
        .song-slot .track-title {
            font-weight: 600;
            font-size: 0.95em;
        }
        .song-slot .track-artist {
            color: #8b949e;
            font-size: 0.85em;
        }
        .song-slot.hidden .track-title,
        .song-slot.hidden .track-artist {
            color: transparent;
            background: #21262d;
            border-radius: 4px;
            display: block;
            margin-bottom: 4px;
            /* fixed widths so the bar length doesn't hint at the answer */
            width: 70%;
            white-space: nowrap;
            overflow: hidden;
        }
        .song-slot.hidden .track-artist { width: 45%; }
        .song-slot.revealed { border-color: #238636; }
        .reveal-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .source-link {
            color: #58a6ff;
            font-size: 0.85em;
            text-decoration: none;
            display: none;
        }
        .source-link:hover { text-decoration: underline; }
        .source-link.visible { display: inline; }
        .progress-bar-container {
            width: 100%;
            height: 4px;
            background: #21262d;
            border-radius: 2px;
            margin-top: 12px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background: #f0883e;
            border-radius: 2px;
            width: 0%;
            transition: width 0.1s linear;
        }
        .spares-heading {
            max-width: 900px;
            margin: 32px auto 12px;
            color: #8b949e;
            font-size: 0.95em;
            cursor: pointer;
            user-select: none;
        }
        #spares.collapsed { display: none; }
    </style>
</head>
<body>
    <a class="back-link" href="../index.html">&larr; All quizzes</a>
    <h1>Mashup Quiz</h1>
    <p class="subtitle">Two songs, one track. Name both to score 2 points.</p>

    <div class="master-controls">
        <label>Clip length:</label>
        <input type="number" class="duration-input" id="clipLength" value="20" min="5" max="120" step="5">
        <label>s</label>
        <span class="player-status" id="playerStatus">Loading YouTube player…</span>
        <button class="stop-btn small" style="margin-left:auto" onclick="exportOffsets()">Export Offsets</button>
        <button class="stop-btn small" onclick="resetOffsets()">Reset Offsets</button>
    </div>
    <pre id="exportOutput" style="display:none;max-width:900px;margin:0 auto 16px;padding:12px 16px;background:#161b22;border:1px solid #30363d;border-radius:8px;color:#e6edf3;font-size:0.85em;white-space:pre-wrap;cursor:pointer;" onclick="navigator.clipboard.writeText(this.textContent);this.style.borderColor='#238636';setTimeout(()=>this.style.borderColor='#30363d',1000)"></pre>

    <div id="questions"></div>

    <div class="spares-heading" onclick="document.getElementById('spares').classList.toggle('collapsed')">
        &#9656; Spare mashups (click to show)
    </div>
    <div id="spares" class="collapsed"></div>

    <div class="player-wrap">
        <div id="ytPlayer"></div>
        <div class="player-cover" id="playerCover">
            <span class="big">&#127911;</span>
            <span id="coverText">Pick a mashup</span>
        </div>
    </div>

    <script>
    // offset = where the clip starts (seconds into the YouTube video).
    // spare: true = listed in the collapsed "Spare mashups" section.
    const QUESTIONS = [
        {
            id: 'H82j1NZfVoU',
            offset: 20,
            length: 122,
            songs: [
                { title: 'Thomas the Tank Engine (Theme)', artist: 'Mike O\'Donnell & Junior Campbell' },
                { title: 'The Fresh Prince of Bel-Air (Theme)', artist: 'DJ Jazzy Jeff & The Fresh Prince' }
            ]
        },
        {
            id: 'fKyb3UXLXJg',
            offset: 30,
            length: 200,
            songs: [
                { title: 'Toxic', artist: 'Britney Spears' },
                { title: 'Rolling in the Deep', artist: 'Adele' }
            ]
        },
        {
            id: 'qwAfzYcXgXc',
            offset: 30,
            length: 169,
            songs: [
                { title: 'Seven Nation Army', artist: 'The White Stripes' },
                { title: 'Sweet Dreams (Are Made of This)', artist: 'Eurythmics' }
            ]
        },
        {
            id: 'eIf3b6meriM',
            offset: 45,
            length: 428,
            songs: [
                { title: 'Baby', artist: 'Justin Bieber' },
                { title: 'Psychosocial', artist: 'Slipknot' }
            ]
        },
        {
            id: 'DmtP1fbmIsQ',
            offset: 30,
            length: 224,
            songs: [
                { title: 'Thunderstruck', artist: 'AC/DC' },
                { title: 'Ghostbusters', artist: 'Ray Parker Jr.' }
            ]
        },
        {
            id: 'yJUHIWB73zU',
            offset: 30,
            length: 219,
            spare: true,
            songs: [
                { title: '22', artist: 'Taylor Swift' },
                { title: 'Party in the U.S.A.', artist: 'Miley Cyrus' }
            ]
        },
        {
            id: 'z8gHMJjDVYA',
            offset: 30,
            length: 259,
            spare: true,
            songs: [
                { title: 'Firework', artist: 'Katy Perry' },
                { title: 'Pompeii', artist: 'Bastille' }
            ]
        }
    ];

    // Offsets tweaked with the +/- buttons survive a reload on this device.
    // Use Export Offsets and paste the values above to make them permanent.
    const STORAGE_KEY = 'mashup-quiz-offsets';
    const DEFAULT_OFFSETS = Object.fromEntries(QUESTIONS.map(q => [q.id, q.offset]));
    try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        for (const q of QUESTIONS) {
            if (typeof saved[q.id] === 'number') q.offset = saved[q.id];
        }
    } catch (e) {}

    const state = {
        player: null,
        ready: false,
        current: null,       // id of the question currently loaded/playing
        playStartedAt: null, // wall clock time the clip actually started playing
        stopTimer: null,
        progressInterval: null
    };

    function labelFor(q) {
        const main = QUESTIONS.filter(x => !x.spare);
        const idx = main.indexOf(q);
        return idx >= 0 ? `Mashup ${idx + 1}` : `Spare ${QUESTIONS.filter(x => x.spare).indexOf(q) + 1}`;
    }

    function fmtTime(s) {
        const m = Math.floor(s / 60);
        return `${m}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
    }

    function getClipLength() {
        return parseFloat(document.getElementById('clipLength').value) || 20;
    }

    function setStatus(text, isError) {
        const el = document.getElementById('playerStatus');
        el.textContent = text;
        el.classList.toggle('error', !!isError);
    }

    function setCover(text) {
        document.getElementById('coverText').innerHTML = text;
    }

    // ---- YouTube player ----

    function onYouTubeIframeAPIReady() {
        state.player = new YT.Player('ytPlayer', {
            width: 200,
            height: 200,
            playerVars: { controls: 0, disablekb: 1, playsinline: 1, rel: 0, iv_load_policy: 3, fs: 0 },
            events: {
                onReady: () => { state.ready = true; setStatus('Player ready'); },
                onStateChange: onPlayerStateChange,
                onError: onPlayerError
            }
        });
    }

    function onPlayerStateChange(e) {
        // Start the clip timer only once audio is actually playing,
        // so buffering doesn't eat into the clip.
        if (e.data === YT.PlayerState.PLAYING && state.current && state.playStartedAt === null) {
            state.playStartedAt = Date.now();
            const duration = getClipLength();
            const bar = document.querySelector(`[data-progress-key="${state.current}"]`);
            state.progressInterval = setInterval(() => {
                const elapsed = (Date.now() - state.playStartedAt) / 1000;
                if (bar) bar.style.width = Math.min(100, (elapsed / duration) * 100) + '%';
            }, 100);
            state.stopTimer = setTimeout(stopAll, duration * 1000);
            setStatus('Playing');
        } else if (e.data === YT.PlayerState.BUFFERING) {
            setStatus('Buffering…');
        } else if (e.data === YT.PlayerState.ENDED) {
            stopAll();
        }
    }

    function onPlayerError(e) {
        const q = QUESTIONS.find(q => q.id === state.current);
        stopAll();
        const reason = (e.data === 101 || e.data === 150) ? 'embedding disabled by owner' : `error ${e.data}`;
        setStatus(`${q ? labelFor(q) : 'Video'} failed (${reason}) — use the YouTube link after revealing`, true);
    }

    function stopAll() {
        clearTimeout(state.stopTimer);
        clearInterval(state.progressInterval);
        state.stopTimer = null;
        state.progressInterval = null;
        state.playStartedAt = null;
        if (state.player && state.ready) state.player.pauseVideo();
        document.querySelectorAll('.play-all-btn.playing').forEach(el => {
            el.classList.remove('playing');
            el.innerHTML = '&#9654; Play Clip';
        });
        document.querySelectorAll('.question-card.active').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.progress-bar').forEach(el => el.style.width = '0%');
        if (state.current) {
            const q = QUESTIONS.find(q => q.id === state.current);
            setCover(`<span class="now">${labelFor(q)}</span>stopped`);
        }
        if (state.ready) setStatus('Player ready');
    }

    function playClip(id) {
        const btn = document.querySelector(`[data-play="${id}"]`);
        const wasPlaying = btn.classList.contains('playing');
        stopAll();
        if (wasPlaying) return;
        if (!state.ready) { setStatus('Player still loading — try again in a moment', true); return; }

        const q = QUESTIONS.find(q => q.id === id);
        state.current = id;
        btn.classList.add('playing');
        btn.innerHTML = '&#9632; Stop';
        document.querySelector(`[data-card="${id}"]`).classList.add('active');
        setCover(`<span class="now">${labelFor(q)}</span>from ${fmtTime(q.offset)}`);
        setStatus('Loading clip…');
        state.player.loadVideoById({ videoId: id, startSeconds: q.offset });
    }

    // ---- Offsets ----

    function saveOffsets() {
        const changed = {};
        for (const q of QUESTIONS) {
            if (q.offset !== DEFAULT_OFFSETS[q.id]) changed[q.id] = q.offset;
        }
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(changed)); } catch (e) {}
    }

    function adjustOffset(id, delta) {
        const q = QUESTIONS.find(q => q.id === id);
        q.offset = Math.max(0, Math.min(q.length - 5, q.offset + delta));
        document.querySelector(`[data-offset-key="${id}"]`).textContent = fmtTime(q.offset);
        saveOffsets();
    }

    function resetOffsets() {
        if (!confirm('Reset all clip start times to the defaults in the file?')) return;
        for (const q of QUESTIONS) q.offset = DEFAULT_OFFSETS[q.id];
        try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
        stopAll();
        render();
    }

    function exportOffsets() {
        const lines = QUESTIONS.map(q =>
            `${labelFor(q)} (${q.songs.map(s => s.title).join(' + ')}): id '${q.id}', offset: ${q.offset}`
        );
        const el = document.getElementById('exportOutput');
        el.textContent = lines.join('\n');
        el.style.display = 'block';
        navigator.clipboard.writeText(el.textContent).catch(() => {});
    }

    // ---- Answers ----

    function toggleSong(id, idx) {
        const slot = document.querySelector(`[data-slot="${id}_${idx}"]`);
        const reveal = slot.classList.contains('hidden');
        slot.classList.toggle('hidden', !reveal);
        slot.classList.toggle('revealed', reveal);
        updateSourceLink(id);
    }

    function revealBoth(id) {
        const q = QUESTIONS.find(q => q.id === id);
        const slots = q.songs.map((_, i) => document.querySelector(`[data-slot="${id}_${i}"]`));
        const reveal = slots.some(s => s.classList.contains('hidden'));
        for (const s of slots) {
            s.classList.toggle('hidden', !reveal);
            s.classList.toggle('revealed', reveal);
        }
        updateSourceLink(id);
    }

    function updateSourceLink(id) {
        const allRevealed = !document.querySelector(`[data-card="${id}"] .song-slot.hidden`);
        document.querySelector(`[data-source="${id}"]`).classList.toggle('visible', allRevealed);
    }

    // ---- Render ----

    function renderCard(q) {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.dataset.card = q.id;
        card.innerHTML = `
            <div class="question-header">
                <span class="question-number">${labelFor(q)}</span>
                <button class="play-all-btn" data-play="${q.id}" onclick="playClip('${q.id}')">&#9654; Play Clip</button>
                <div class="offset-controls" title="Clip start time">
                    <button class="offset-btn" onclick="adjustOffset('${q.id}', -5)">-5</button>
                    <button class="offset-btn" onclick="adjustOffset('${q.id}', -1)">-1</button>
                    <span class="offset-display" data-offset-key="${q.id}">${fmtTime(q.offset)}</span>
                    <button class="offset-btn" onclick="adjustOffset('${q.id}', 1)">+1</button>
                    <button class="offset-btn" onclick="adjustOffset('${q.id}', 5)">+5</button>
                </div>
            </div>
            <div class="songs">
                ${q.songs.map((s, i) => `
                    <div class="song-slot hidden" data-slot="${q.id}_${i}" onclick="toggleSong('${q.id}', ${i})">
                        <div class="slot-label">Song ${i + 1} — click to reveal</div>
                        <div class="track-title">${s.title}</div>
                        <div class="track-artist">${s.artist}</div>
                    </div>
                `).join('')}
            </div>
            <div class="reveal-row">
                <button class="stop-btn small" onclick="revealBoth('${q.id}')">Reveal Both</button>
                <a class="source-link" data-source="${q.id}" href="https://www.youtube.com/watch?v=${q.id}&t=${q.offset}s" target="_blank" rel="noopener">Watch on YouTube &#8599;</a>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar" data-progress-key="${q.id}"></div>
            </div>
        `;
        return card;
    }

    function render() {
        const main = document.getElementById('questions');
        const spares = document.getElementById('spares');
        main.innerHTML = '';
        spares.innerHTML = '';
        for (const q of QUESTIONS) {
            (q.spare ? spares : main).appendChild(renderCard(q));
        }
    }

    render();
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') stopAll();
    });
    </script>
    <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
