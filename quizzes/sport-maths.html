<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sport Maths</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #0d1117;
  color: #e0e0e0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  min-height: 100vh;
  padding: 32px 16px;
}

.container { max-width: 980px; margin: 0 auto; }

.back-link { color: #8b949e; text-decoration: none; font-size: 0.9rem; }
.back-link:hover { color: #e0e0e0; }

header {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  margin: 12px 0 8px;
  gap: 12px;
  flex-wrap: wrap;
}

h1 { font-size: 2rem; color: #3fb950; }

.name-line { font-size: 0.95rem; color: #8b949e; display: none; }

.intro {
  color: #8b949e;
  font-size: 0.9rem;
  margin-bottom: 20px;
  line-height: 1.5;
}

.toolbar {
  display: flex;
  gap: 12px;
  align-items: center;
  margin-bottom: 24px;
  flex-wrap: wrap;
}
.toolbar .count { color: #8b949e; font-size: 0.85rem; margin-left: auto; }

button {
  background: #21262d;
  color: #e0e0e0;
  border: 1px solid #30363d;
  border-radius: 8px;
  padding: 8px 18px;
  font-size: 0.9rem;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}
button:hover { background: #30363d; }
button.primary { background: #238636; border-color: #2ea043; color: #fff; }
button.primary:hover { background: #2ea043; }

.question {
  display: grid;
  grid-template-columns: 2.2em 1fr auto 1fr auto 1fr;
  align-items: stretch;
  gap: 10px;
  padding: 14px 0;
  border-bottom: 1px solid #21262d;
  break-inside: avoid;
}

.qnum {
  font-size: 1.3rem;
  font-weight: 700;
  color: #3fb950;
  padding-top: 2px;
}

.fact {
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 10px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.fact-sport {
  font-size: 0.68rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: #3fb950;
  font-weight: 600;
}

.fact-label { font-size: 0.95rem; line-height: 1.35; flex: 1; }

.answer-box {
  border: 2px solid #30363d;
  border-radius: 6px;
  height: 2.6em;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.4rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: #d29922;
}
.answer-box .value { display: none; }

.fact-note {
  font-size: 0.75rem;
  color: #8b949e;
  line-height: 1.35;
  display: none;
}

.op {
  font-size: 2rem;
  font-weight: 700;
  color: #8b949e;
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 24px;
}

.maths-warning {
  grid-column: 2 / -1;
  color: #f85149;
  font-size: 0.85rem;
}

body.show-answers .answer-box .value,
body.show-answers .fact-note:not(:empty) { display: block; }

.asof { text-align: center; color: #484f58; font-size: 0.75rem; margin-top: 28px; }

@media screen and (max-width: 720px) {
  .question { grid-template-columns: 1fr; }
  .op { font-size: 1.6rem; }
}

@media print {
  @page { margin: 14mm; }
  body { background: #fff; color: #000; padding: 0; font-size: 10pt; }
  .back-link, .toolbar, .maths-warning { display: none !important; }
  .name-line { display: block; color: #000; }
  h1 { color: #000; font-size: 20pt; }
  .intro { color: #333; margin-bottom: 8px; }
  .question { border-bottom: 1px solid #ccc; padding: 6px 0; gap: 8px; }
  .qnum { color: #000; font-size: 13pt; }
  .fact { background: #fff; border: 1px solid #999; border-radius: 6px; padding: 5px 8px; gap: 3px; }
  .fact-sport { color: #555; font-size: 6.5pt; }
  .fact-label { font-size: 9.5pt; line-height: 1.25; }
  .op { color: #000; font-size: 18pt; }
  .answer-box { border: 1.5px solid #000; height: 1.9em; font-size: 13pt; color: #000; }
  .fact-note { font-size: 7pt; }
  .fact-note { color: #444; }
  .asof { color: #888; }
}
</style>
</head>
<body>

<div class="container">
  <a class="back-link" href="../index.html">&larr; All quizzes</a>
  <header>
    <h1>Sport Maths</h1>
    <div class="name-line">Name: ______________________ &nbsp; Score: ____ / <span id="max-score"></span></div>
  </header>
  <p class="intro">Each line is a sum made of three sporting numbers. Fill in all three boxes.
    Know two of them? Use the maths to work out the third. One point per correct number.</p>

  <div class="toolbar">
    <button class="primary" onclick="window.print()">Print</button>
    <button id="answers-btn" onclick="toggleAnswers()">Show Answers</button>
    <span class="count" id="count"></span>
  </div>

  <div id="questions"></div>

  <p class="asof">Facts correct as of October 2026</p>
</div>

<script>
// Generated with tools/sport_maths/find_combos.py, hand-picked.
// Each question reads: facts[0] op facts[1] = facts[2].
const QUESTIONS = [
  { op: '+', facts: [
    { sport: 'Formula 1', label: "Lewis Hamilton's F1 World Championships", value: 7, note: '2008, 2014, 2015, 2017, 2018, 2019, 2020' },
    { sport: 'Football', label: "Manchester City's Premier League titles", value: 8, note: '2012, 2014, 2018, 2019, 2021, 2022, 2023, 2024' },
    { sport: 'Snooker', label: 'Red balls on a snooker table', value: 15, note: 'Plus six colours, making 22 balls with the cue ball' },
  ]},
  { op: '×', facts: [
    { sport: 'Snooker', label: 'Pockets on a snooker table', value: 6, note: 'Four corners, two middles' },
    { sport: 'Golf', label: "Tiger Woods's major titles", value: 15, note: '5 Masters, 4 PGA Championships, 3 US Opens, 3 Opens' },
    { sport: 'Football', label: 'Minutes in a football match', value: 90, note: 'Two halves of 45, plus stoppage time' },
  ]},
  { op: '+', facts: [
    { sport: 'Football', label: "Manchester United's Premier League titles", value: 13, note: 'All under Sir Alex Ferguson, the last in 2013' },
    { sport: 'Rugby union', label: 'Points for a try in rugby union', value: 5, note: 'Raised from 4 to 5 in 1992' },
    { sport: 'Golf', label: 'Holes on a full golf course', value: 18, note: 'St Andrews settled on 18 holes in 1764' },
  ]},
  { op: '×', facts: [
    { sport: 'Golf', label: 'Holes on a full golf course', value: 18, note: '' },
    { sport: 'Football', label: "Pelé's shirt number", value: 10, note: 'Brazil and Santos' },
    { sport: 'Darts', label: 'Maximum score with three darts', value: 180, note: 'Three treble 20s' },
  ]},
  { op: '×', facts: [
    { sport: 'Darts', label: 'Fewest darts needed to finish a 501 leg', value: 9, note: 'The nine-dart finish' },
    { sport: 'Football', label: 'Players in a football team', value: 11, note: '' },
    { sport: 'Ice hockey', label: "Wayne Gretzky's shirt number", value: 99, note: 'Retired across the whole NHL in 2000' },
  ]},
  { op: '×', facts: [
    { sport: 'Tennis', label: 'Grand Slam tennis tournaments each year', value: 4, note: 'Australian Open, French Open, Wimbledon, US Open' },
    { sport: 'Basketball', label: "Michael Jordan's shirt number", value: 23, note: 'He also wore 45 (and once 12)' },
    { sport: 'Football', label: 'Clubs in the top four divisions of English football', value: 92, note: '20 in the Premier League + 72 in the EFL' },
  ]},
  { op: '×', facts: [
    { sport: 'Snooker', label: 'Points for potting the black', value: 7, note: '' },
    { sport: 'NFL', label: "Tom Brady's Super Bowl wins", value: 7, note: 'Six with New England, one with Tampa Bay' },
    { sport: 'Football', label: "Arsenal's unbeaten league run (the Invincibles)", value: 49, note: 'May 2003 to October 2004' },
  ]},
  { op: '×', facts: [
    { sport: 'Darts', label: 'Fewest darts needed to finish a 501 leg', value: 9, note: '' },
    { sport: 'Athletics', label: "Usain Bolt's Olympic gold medals", value: 8, note: 'Nine won; one 4×100m relay gold was taken away in 2017' },
    { sport: 'Golf', label: 'Par for a typical championship golf course', value: 72, note: '' },
  ]},
  { op: '×', facts: [
    { sport: 'Cricket', label: 'Balls in a cricket over', value: 6, note: '' },
    { sport: 'Darts', label: 'Points for a bullseye', value: 50, note: 'The outer bull is worth 25' },
    { sport: 'Bowling', label: 'Perfect score in ten-pin bowling', value: 300, note: '12 strikes in a row' },
  ]},
  { op: '×', facts: [
    { sport: 'Athletics', label: 'Whole miles in a marathon', value: 26, note: '26 miles 385 yards' },
    { sport: 'Bowling', label: 'Pins in ten-pin bowling', value: 10, note: '' },
    { sport: 'Football', label: "Alan Shearer's Premier League goals", value: 260, note: 'Still the Premier League record' },
  ]},
  { op: '×', facts: [
    { sport: 'Football', label: "Lionel Messi's shirt number for Argentina", value: 10, note: '' },
    { sport: 'Tennis', label: "A tennis player's score after winning three points in a game", value: 40, note: 'Love, 15, 30, 40' },
    { sport: 'Cricket', label: "Brian Lara's record Test score", value: 400, note: '400 not out against England, Antigua 2004' },
  ]},
  { op: '+', facts: [
    { sport: 'Snooker', label: 'Maximum snooker break', value: 147, note: '' },
    { sport: 'Swimming', label: "Michael Phelps's Olympic gold medals", value: 23, note: 'Out of 28 Olympic medals' },
    { sport: 'Darts', label: 'Highest possible checkout in darts', value: 170, note: 'Treble 20, treble 20, bullseye' },
  ]},
  { op: '×', facts: [
    { sport: 'Darts', label: 'Points for a bullseye', value: 50, note: '' },
    { sport: 'Cricket', label: "Sachin Tendulkar's international centuries", value: 100, note: '51 in Tests, 49 in ODIs' },
    { sport: 'Football', label: "Leicester's odds of winning the 2015-16 Premier League (__-1)", value: 5000, note: 'And they won it' },
  ]},
  { op: '×', facts: [
    { sport: 'Formula 1', label: "Lewis Hamilton's F1 World Championships", value: 7, note: '' },
    { sport: 'Cycling', label: 'Stages in the Tour de France', value: 21, note: '' },
    { sport: 'Snooker', label: 'Maximum snooker break', value: 147, note: '15 reds with 15 blacks, then all the colours' },
  ]},
];

const OP_FN = { '+': (a, b) => a + b, '−': (a, b) => a - b, '×': (a, b) => a * b, '÷': (a, b) => a / b };

function factEl(f) {
  const el = document.createElement('div');
  el.className = 'fact';
  el.innerHTML = `
    <div class="fact-sport">${f.sport}</div>
    <div class="fact-label">${f.label}</div>
    <div class="answer-box"><span class="value">${f.value}</span></div>
    <div class="fact-note">${f.note}</div>`;
  return el;
}

function opEl(sym) {
  const el = document.createElement('div');
  el.className = 'op';
  el.textContent = sym;
  return el;
}

function render() {
  const container = document.getElementById('questions');
  QUESTIONS.forEach((q, i) => {
    const row = document.createElement('div');
    row.className = 'question';
    const num = document.createElement('div');
    num.className = 'qnum';
    num.textContent = i + 1;
    row.append(num, factEl(q.facts[0]), opEl(q.op), factEl(q.facts[1]), opEl('='), factEl(q.facts[2]));

    // Flags a broken sum while editing; hidden when printed.
    const [a, b, c] = q.facts.map(f => f.value);
    const result = OP_FN[q.op] ? OP_FN[q.op](a, b) : NaN;
    if (result !== c) {
      const warn = document.createElement('div');
      warn.className = 'maths-warning';
      warn.textContent = `⚠ Maths doesn't work: ${a} ${q.op} ${b} = ${result}, not ${c}`;
      row.appendChild(warn);
    }
    container.appendChild(row);
  });
  document.getElementById('max-score').textContent = QUESTIONS.length * 3;
  document.getElementById('count').textContent = `${QUESTIONS.length} questions · ${QUESTIONS.length * 3} points`;
}

function toggleAnswers() {
  const on = document.body.classList.toggle('show-answers');
  document.getElementById('answers-btn').textContent = on ? 'Hide Answers' : 'Show Answers';
}

render();
</script>
</body>
</html>
